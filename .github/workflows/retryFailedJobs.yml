# Auto-retry workflow runs that failed reaching OpenShift — the API server (oc login, :6443)
# or the image registry route (docker login) — when some GitHub-hosted runner egress IPs are
# dropped by source IP.
#
# Why this exists: in-job retry loops never recover, because the runner's egress IP is fixed
# for the life of the job — every retry re-sends from the same blocked IP. Re-running the
# *job* lands it on a fresh runner with a fresh egress IP, which is the only retry that works.
# This workflow watches for failed runs, decides whether the failure was connectivity rather
# than a genuine build or deploy error, and re-runs only the failed jobs.
#
# See SIMSBIOHUB-1079.
name: Retry Jobs Failed on OpenShift Connectivity

on:
  workflow_run:
    workflows:
      - "PR-Based Deploy on OpenShift"
      - "Static Deploy on OpenShift"
      - "Clean PR Artifacts"
      - "Sweep Stale PR Environments"
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Re-run failed jobs on a fresh runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # run_attempt < 4 → up to 3 automatic re-runs (4 attempts total) before giving up.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4
    steps:
      - name: Detect retryable OpenShift failures
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # This step name is load-bearing: deploy.yml and deployStatic.yml must keep it, or
          # the registry-auth retry below silently stops firing.
          DOCKER_AUTH_STEP="Authenticate Docker with OpenShift registry"

          jobs_json="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")"

          # The registry auth step is retried on *any* failure rather than on a recognised
          # error string, because it reports the same drop under several wordings and a new
          # one puts us back here. The token is either valid or it is not, so anything else is
          # connectivity — and a misconfigured token fails all eight build jobs identically,
          # which is unmistakable. A failed `docker login` costs seconds, so a fresh runner is
          # cheaper than classifying the error. Match the name exactly: the same response also
          # reports workflowStatus's "Report failure" step as failed.
          docker_auth_failures="$(printf '%s' "${jobs_json}" | jq --arg step "${DOCKER_AUTH_STEP}" '
            [.jobs[] | select(.conclusion == "failure")
             | .steps[] | select(.conclusion == "failure" and .name == $step)] | length')"

          if [ "${docker_auth_failures}" -gt 0 ]; then
            echo "A job failed on \"${DOCKER_AUTH_STEP}\"; re-running on a fresh runner."
            echo "timeout_failure=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Every other step is retried only when its log shows a connection timeout to the API
          # server (:6443) or the registry route. Genuine build, test and deploy failures are
          # left for a human — in particular Helm's "context deadline exceeded", which means the
          # release never became ready inside its --wait timeout. Retrying that cannot fix it
          # and costs another full deploy per attempt, so do not add the bare string here.
          found=false
          for job_id in $(printf '%s' "${jobs_json}" | jq '.jobs[] | select(.conclusion == "failure") | .id'); do
            if gh api "repos/${REPO}/actions/jobs/${job_id}/logs" 2>/dev/null \
                | grep -qE ':6443: i/o timeout|Client\.Timeout exceeded while awaiting headers|request canceled while waiting for connection|net/http: TLS handshake timeout'; then
              echo "Job ${job_id} failed on an OpenShift connection timeout."
              found=true
              break
            fi
          done
          echo "timeout_failure=${found}" >> "${GITHUB_OUTPUT}"

      - name: Re-run failed jobs
        if: steps.detect.outputs.timeout_failure == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "Attempt ${ATTEMPT} of run ${RUN_ID} failed on the connection timeout; re-running failed jobs."
          gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
