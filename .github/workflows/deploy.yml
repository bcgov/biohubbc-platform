# PR Based Deploy On OpenShift
# Builds and Deploys unmerged PR's to temporary pods/services/routes/etc in the OpenShift Dev environment.
name: PR-Based Deploy on OpenShift

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, unlabeled]
    branches-ignore:
      - test
      - prod

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_TAG: build-1.0.0-${{ github.event.number }}
  OC_VERSION: "4.16.60"
  OC_CACHE_DIR: ~/.cache/oc
  # Opt composite JS actions (e.g. actions/download-artifact@v6) into Node.js 24 until they ship node24 runtimes.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Print variables for logging, and decide whether this PR gets a preview environment. Every
  # job below gates on the `deployPreview` output, so the rule lives in exactly one place.
  checkEnv:
    name: Print Env variables
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An `unlabeled` event for any other label says nothing about the preview; without this,
    # moving a triage label would rebuild four images.
    if: ${{ github.event.pull_request.merged == false &&
      (github.event.action != 'unlabeled' || github.event.label.name == 'No Preview') }}
    outputs:
      # A preview environment exists only for a PR that is open, not draft, and without the
      # "No Preview" label — which is how a stacked PR stays ready for review while taking no
      # share of the namespace quota. Job outputs are strings, hence the literal 'true'.
      deployPreview: ${{ github.event.pull_request.draft == false &&
        !contains(github.event.pull_request.labels.*.name, 'No Preview') }}
    steps:
      - name: Print Env Vars
        # Branch and label names are author-controlled: pass them through env, never interpolate.
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
          DEPLOY_PREVIEW: ${{ github.event.pull_request.draft == false &&
            !contains(github.event.pull_request.labels.*.name, 'No Preview') }}
        run: |
          echo OC CLI Version: $(oc version)
          echo Git Base Ref: ${{ github.base_ref }}
          echo Git Change ID: ${{ github.event.number }}
          echo Git Pull Request Ref: ${{ github.event.pull_request.head.sha }}
          echo Git Event Name: ${{ github.event_name }}
          echo Git Event Action: ${{ github.event.action }}
          echo "Git Branch Ref: ${HEAD_REF}"
          echo PR in Draft: ${{ github.event.pull_request.draft }}
          echo "PR Labels: ${PR_LABELS}"
          echo "Deploy Preview: ${DEPLOY_PREVIEW}"

  # Checkout the repo once and cache it for use in subsequent jobs
  checkoutRepo:
    name: Checkout and cache target branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ needs.checkEnv.outputs.deployPreview == 'true' }}
    env:
      PR_NUMBER: ${{ github.event.number }}
    needs:
      - checkEnv
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Cache the repo
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          # Cache repo based on the commit sha that triggered the workflow
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Install Node - for `node` and `npm` commands
      # Note: This already uses actions/cache internally, so repeat calls in subsequent jobs are not a performance hit
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

  # Build the web frontend app image
  buildAndPushApp:
    name: Build App Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ needs.checkEnv.outputs.deployPreview == 'true' }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohub-platform-app"
    needs:
      - checkEnv
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Authenticate Docker with OpenShift registry.
      # The registry route intermittently times out from some runner egress IPs (same source-IP drop as the
      # oc login timeouts). In-step retries can't recover — the egress IP is fixed for the job's lifetime —
      # so retryFailedJobs.yml re-runs the job on a fresh runner instead. It keys that retry on this step's
      # name, so renaming the step disables the retry. The egress IP is logged here so failed and successful
      # runs can be correlated with source IPs.
      - name: Authenticate Docker with OpenShift registry
        env:
          OPENSHIFT_TOKEN: ${{ secrets.TOOLS_SA_TOKEN }}
          OPENSHIFT_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
        run: |
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo UNKNOWN)"
          echo "$OPENSHIFT_TOKEN" | docker login -u unused --password-stdin "$OPENSHIFT_REGISTRY"

      # Build and push the app image
      - name: Build and Push App Image
        working-directory: app
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  # Build the Database image
  buildAndPushDatabase:
    name: Build Database Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ needs.checkEnv.outputs.deployPreview == 'true' }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohub-platform-db"
    needs:
      - checkEnv
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Authenticate Docker with OpenShift registry.
      # The registry route intermittently times out from some runner egress IPs (same source-IP drop as the
      # oc login timeouts). In-step retries can't recover — the egress IP is fixed for the job's lifetime —
      # so retryFailedJobs.yml re-runs the job on a fresh runner instead. It keys that retry on this step's
      # name, so renaming the step disables the retry. The egress IP is logged here so failed and successful
      # runs can be correlated with source IPs.
      - name: Authenticate Docker with OpenShift registry
        env:
          OPENSHIFT_TOKEN: ${{ secrets.TOOLS_SA_TOKEN }}
          OPENSHIFT_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
        run: |
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo UNKNOWN)"
          echo "$OPENSHIFT_TOKEN" | docker login -u unused --password-stdin "$OPENSHIFT_REGISTRY"

      # Build and push the database image using Docker
      - name: Build and Push Database Image
        working-directory: database
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  # Build the Database Setup image
  buildAndPushDatabaseSetup:
    name: Build Database Setup Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ needs.checkEnv.outputs.deployPreview == 'true' }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohub-platform-db-setup"
    needs:
      - checkEnv
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Authenticate Docker with OpenShift registry.
      # The registry route intermittently times out from some runner egress IPs (same source-IP drop as the
      # oc login timeouts). In-step retries can't recover — the egress IP is fixed for the job's lifetime —
      # so retryFailedJobs.yml re-runs the job on a fresh runner instead. It keys that retry on this step's
      # name, so renaming the step disables the retry. The egress IP is logged here so failed and successful
      # runs can be correlated with source IPs.
      - name: Authenticate Docker with OpenShift registry
        env:
          OPENSHIFT_TOKEN: ${{ secrets.TOOLS_SA_TOKEN }}
          OPENSHIFT_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
        run: |
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo UNKNOWN)"
          echo "$OPENSHIFT_TOKEN" | docker login -u unused --password-stdin "$OPENSHIFT_REGISTRY"

      # Build and push the database setup image using Docker
      - name: Build and Push Database Setup Image
        working-directory: database
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} -f .docker/db/Dockerfile.setup .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          
      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  # Build the API image
  buildAndPushAPI:
    name: Build API Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ needs.checkEnv.outputs.deployPreview == 'true' }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohub-platform-api"
    needs:
      - checkEnv
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Authenticate Docker with OpenShift registry.
      # The registry route intermittently times out from some runner egress IPs (same source-IP drop as the
      # oc login timeouts). In-step retries can't recover — the egress IP is fixed for the job's lifetime —
      # so retryFailedJobs.yml re-runs the job on a fresh runner instead. It keys that retry on this step's
      # name, so renaming the step disables the retry. The egress IP is logged here so failed and successful
      # runs can be correlated with source IPs.
      - name: Authenticate Docker with OpenShift registry
        env:
          OPENSHIFT_TOKEN: ${{ secrets.TOOLS_SA_TOKEN }}
          OPENSHIFT_REGISTRY: ${{ vars.OPENSHIFT_REGISTRY }}
        run: |
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo UNKNOWN)"
          echo "$OPENSHIFT_TOKEN" | docker login -u unused --password-stdin "$OPENSHIFT_REGISTRY"

      # Build and push the API image
      - name: Build and Push API Image
        working-directory: api
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  buildAndPushMartinGateway:
    name: Build Martin Gateway Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.pull_request.merged == false && github.event.pull_request.draft == false }}
    env:
      PR_NUMBER: ${{ github.event.number }}
      APP_NAME: "biohub-platform-martin-gateway"
    needs:
      - checkoutRepo
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v6

      # Authenticate Docker with OpenShift registry.
      # The registry route intermittently times out from some runner egress IPs (same source-IP drop as the
      # oc login timeouts). In-step retries can't recover — the egress IP is fixed for the job's lifetime —
      # so retryFailedJobs.yml re-runs the job on a fresh runner instead. The egress IP is logged here so
      # failed and successful runs can be correlated with source IPs.
      - name: Authenticate Docker with OpenShift registry
        run: |
          echo "Runner egress IP: $(curl -s --max-time 10 https://api.ipify.org || echo UNKNOWN)"
          echo ${{ secrets.TOOLS_SA_TOKEN }} | docker login -u unused --password-stdin ${{ vars.OPENSHIFT_REGISTRY }}

      # Build and push the API image
      - name: Build and Push Martin Gateway Image
        working-directory: martin-gateway
        run: |
          docker build -t ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }} .
          docker push ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/$APP_NAME:${{ env.IMAGE_TAG }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.OPENSHIFT_REGISTRY }}/${{ vars.OPENSHIFT_LICENSE_PLATE }}-tools/${{ env.APP_NAME }}:${{ env.IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-${{ env.APP_NAME }}-results.sarif'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ env.APP_NAME }}-results
          path: trivy-${{ env.APP_NAME }}-results.sarif

  # Deploy Helm chart
  deployHelmChart:
    name: Deploy Helm Chart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() &&
      needs.checkEnv.outputs.deployPreview == 'true' &&
      needs.buildAndPushApp.result == 'success' &&
      needs.buildAndPushDatabase.result == 'success' &&
      needs.buildAndPushDatabaseSetup.result == 'success' &&
      needs.buildAndPushAPI.result == 'success' &&
      needs.buildAndPushMartinGateway.result == 'success' }}
    environment: dev
    env:
      PR_NUMBER: ${{ github.event.number }}
    needs:
      - checkEnv
      - buildAndPushApp
      - buildAndPushDatabase
      - buildAndPushDatabaseSetup
      - buildAndPushAPI
      - buildAndPushMartinGateway
    steps:
      # Load repo from cache
      - name: Cache repo
        uses: actions/cache@v5
        id: cache-repo
        env:
          cache-name: cache-repo
        with:
          path: ${{ github.workspace }}
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.event.pull_request.head.sha }}

      # Checkout the branch if not restored via cache
      - name: Checkout Target Branch
        if: steps.cache-repo.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Install oc (see .github/actions/setup-openshift-cli). Fork PRs have no secrets — oc commands will fail.
      - uses: ./.github/actions/setup-openshift-cli
        env:
          OPENSHIFT_TOKEN: ${{ secrets.TOOLS_SA_TOKEN }}
        with:
          oc-version: ${{ env.OC_VERSION }}
          cache-dir: ${{ env.OC_CACHE_DIR }}
          login: "true"
          namespace: ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev

      # Scale down this PR's existing pods before deploying.
      # Why? Helm creates the new pods before the old ones terminate, and twice the resources would be needed in that
      # moment. Scaling to zero first avoids deploy failures when the namespace is near its resource quota.
      - name: Scale down PR pods
        run: oc get deployment --namespace ${{ vars.OPENSHIFT_LICENSE_PLATE }}-dev --selector env-id=$PR_NUMBER -o name | xargs -r -n1 oc scale --replicas=0

      # Deploy the Helm chart
      - name: Deploy Helm Chart
        run: |
          echo "Deploying Helm chart for PR $PR_NUMBER"

          # Generate a timestamp
          TS=$(date +%s)
          
          # Update Helm dependencies
          echo "Updating Helm dependencies..."
          helm dependency update ./infrastructure/biohub-platform
          
          # Build chart
          echo "Building chart..."
          helm package ./infrastructure/biohub-platform \
            --version $TS \
            --app-version 1.0.0

          helm upgrade --install "pr-$PR_NUMBER" biohub-platform-$TS.tgz \
            -f ./infrastructure/biohub-platform/values.yaml \
            -f ./infrastructure/biohub-platform/values-pr.yaml \
            --set-string biohub-platform-app.environment.ts=$TS \
            --set-string biohub-platform-app.environment.id=$PR_NUMBER \
            --set-string biohub-platform-app.environment.changeId=$PR_NUMBER \
            --set-string biohub-platform-db.environment.ts=$TS \
            --set-string biohub-platform-db.environment.id=$PR_NUMBER \
            --set-string biohub-platform-db.environment.changeId=$PR_NUMBER \
            --set-string biohub-platform-db.app.postgresAdmin=${{ secrets.DATABASE_ADMIN }} \
            --set-string biohub-platform-db.app.postgresAdminPassword=${{ secrets.DATABASE_ADMIN_PASSWORD }} \
            --set-string biohub-platform-db.app.postgresUser=${{ secrets.DATABASE_USER }} \
            --set-string biohub-platform-db.app.postgresUserPassword=${{ secrets.DATABASE_USER_PASSWORD }} \
            --set-string biohub-platform-db.app.postgresUserApi=${{ secrets.DATABASE_USER_API }} \
            --set-string biohub-platform-db.app.postgresUserApiPassword=${{ secrets.DATABASE_USER_API_PASSWORD }} \
            --set-string biohub-platform-db.app.postgresUserMartin=${{ secrets.DATABASE_USER_MARTIN }} \
            --set-string biohub-platform-db.app.postgresUserMartinPassword=${{ secrets.DATABASE_USER_MARTIN_PASSWORD }} \
            --set-string biohub-platform-db.app.postgresDb=${{ secrets.DATABASE_NAME }} \
            --set-string biohub-platform-db-setup.environment.ts=$TS \
            --set-string biohub-platform-db-setup.environment.id=$PR_NUMBER \
            --set-string biohub-platform-db-setup.environment.changeId=$PR_NUMBER \
            --set-string biohub-platform-api.environment.ts=$TS \
            --set-string biohub-platform-api.environment.id=$PR_NUMBER \
            --set-string biohub-platform-api.environment.changeId=$PR_NUMBER \
            --set-string biohub-platform-queue.environment.ts=$TS \
            --set-string biohub-platform-queue.environment.id=$PR_NUMBER \
            --set-string biohub-platform-queue.environment.changeId=$PR_NUMBER \
            --set-string biohub-platform-martin.environment.ts=$TS \
            --set-string biohub-platform-martin.environment.id=$PR_NUMBER \
            --set-string biohub-platform-martin.environment.changeId=$PR_NUMBER \
            --wait --timeout=600s
          
          echo "Helm chart deployment completed for PR $PR_NUMBER"

  # Aggregate Trivy scan results and comment on PR
  commentTrivyResults:
    name: Comment Trivy Results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only this job uses GITHUB_TOKEN: github-script posts the vulnerability summary as a PR comment.
    permissions:
      pull-requests: write
    if: ${{ needs.checkEnv.outputs.deployPreview == 'true' }}
    needs:
      - checkEnv
      - buildAndPushApp
      - buildAndPushDatabase
      - buildAndPushDatabaseSetup
      - buildAndPushAPI
      - buildAndPushMartinGateway
    steps:
      - name: Download all Trivy scan results
        uses: actions/download-artifact@v6
        with:
          path: trivy-results

      - name: Check for vulnerabilities and comment on PR
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Function to parse SARIF file and extract vulnerability counts
            function parseSarifFile(filePath) {
              try {
                if (!fs.existsSync(filePath)) {
                  return { critical: 0, high: 0, total: 0 };
                }
                
                const sarifData = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                const results = sarifData.runs?.[0]?.results || [];
                
                const counts = { critical: 0, high: 0, total: 0 };
                
                results.forEach(result => {
                  const severity = result.properties?.vulnerability?.severity?.toLowerCase() || 
                                 result.ruleId?.toLowerCase() || 'unknown';
                  
                  counts.total++;
                  
                  if (severity.includes('critical')) counts.critical++;
                  else if (severity.includes('high')) counts.high++;
                });
                
                return counts;
              } catch (error) {
                console.log(`Error parsing ${filePath}:`, error.message);
                return { critical: 0, high: 0, total: 0 };
              }
            }
            
            // Parse all scan results
            const appResults = parseSarifFile('trivy-results/trivy-biohub-platform-app-results/trivy-biohub-platform-app-results.sarif');
            const databaseResults = parseSarifFile('trivy-results/trivy-biohub-platform-db-results/trivy-biohub-platform-db-results.sarif');
            const databaseSetupResults = parseSarifFile('trivy-results/trivy-biohub-platform-db-setup-results/trivy-biohub-platform-db-setup-results.sarif');
            const apiResults = parseSarifFile('trivy-results/trivy-biohub-platform-api-results/trivy-biohub-platform-api-results.sarif');
            const martinGatewayResults = parseSarifFile('trivy-results/trivy-biohub-platform-martin-gateway-results/trivy-biohub-platform-martin-gateway-results.sarif');
            
            // Calculate totals
            const totalCritical = appResults.critical + databaseResults.critical + databaseSetupResults.critical + apiResults.critical + martinGatewayResults.critical;
            const totalHigh = appResults.high + databaseResults.high + databaseSetupResults.high + apiResults.high + martinGatewayResults.high;
            const totalVulnerabilities = totalCritical + totalHigh;
            
            // Only comment if there are vulnerabilities
            if (totalVulnerabilities > 0) {
              const comment = `## 🔍 Trivy Security Scan Results
              
              **Total Vulnerabilities Found:** ${totalVulnerabilities}
              
              | Severity | Count |
              |----------|-------|
              | 🔴 Critical | ${totalCritical} |
              | 🟠 High | ${totalHigh} |
              
              ### Breakdown by Image:
              
              **App Image:**
              - Critical: ${appResults.critical}, High: ${appResults.high}
              
              **Database Image:**
              - Critical: ${databaseResults.critical}, High: ${databaseResults.high}
              
              **Database Setup Image:**
              - Critical: ${databaseSetupResults.critical}, High: ${databaseSetupResults.high}
              
              **API Image:**
              - Critical: ${apiResults.critical}, High: ${apiResults.high}
              
              **Martin Gateway Image:**
              - Critical: ${martinGatewayResults.critical}, High: ${martinGatewayResults.high}
              
              ---
              
              **Note:** This scan was performed using Trivy on the container images built for this PR, focusing only on Critical and High severity vulnerabilities with available fixes. Please review the vulnerabilities and consider updating dependencies or base images as needed.
              
              For detailed vulnerability information, check the workflow logs for the Trivy scan steps.`;
              
              // Post comment to PR
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              
              console.log(`Posted Trivy scan results comment to PR #${context.issue.number}`);
            } else {
              console.log('No vulnerabilities found in any of the scanned images');
            }

  # Report the overall status of all jobs.
  # Why? Skipped jobs are not considered successes when specifying required jobs in the GitHub PR settings. Rather
  # than specify each job, we can specify this final job only, and use its status as an indicator of all previous
  # jobs having successfully run. We can then manually include the 'skipped' status as part of our definition of
  # success.
  workflowStatus:
    name: Workflow Status
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() && needs.checkEnv.outputs.deployPreview == 'true' }}
    needs:
      - checkEnv
      - checkoutRepo
      - buildAndPushApp
      - buildAndPushDatabase
      - buildAndPushDatabaseSetup
      - buildAndPushAPI
      - buildAndPushMartinGateway
      - deployHelmChart
      - commentTrivyResults
    steps:
      - name: Log result
        run: |
          echo needs.checkEnv.result: ${{ needs.checkEnv.result }}
          echo needs.checkoutRepo.result: ${{ needs.checkoutRepo.result }}
          echo needs.buildAndPushApp.result: ${{ needs.buildAndPushApp.result }}
          echo needs.buildAndPushDatabase.result: ${{ needs.buildAndPushDatabase.result }}
          echo needs.buildAndPushDatabaseSetup.result: ${{ needs.buildAndPushDatabaseSetup.result }}
          echo needs.buildAndPushAPI.result: ${{ needs.buildAndPushAPI.result }}
          echo needs.buildAndPushMartinGateway.result: ${{ needs.buildAndPushMartinGateway.result }}
          echo needs.deployHelmChart.result: ${{ needs.deployHelmChart.result }}
          echo needs.commentTrivyResults.result: ${{ needs.commentTrivyResults.result }}

      - name: Report success
        if: |
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
        run: |
          echo All deployments completed successfully or were skipped
          exit 0

      - name: Report failure
        if: |
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo One or more deployments failed or was cancelled
          exit 1
