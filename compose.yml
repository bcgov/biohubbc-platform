services:
  ## Build postgres docker image
  db:
    image: ${DOCKER_PROJECT_NAME}-db-${DOCKER_NAMESPACE}-img
    container_name: ${DOCKER_PROJECT_NAME}-db-${DOCKER_NAMESPACE}-container
    build:
      context: ./database/.docker/db
      dockerfile: Dockerfile
      args:
        - POSTGRES_VERSION=${POSTGRES_VERSION}
        - POSTGIS_VERSION=${POSTGIS_VERSION}
        - TZ=${DB_TZ}
    ports:
      - ${DB_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_ADMIN -p 5432 -d $DB_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      - NODE_ENV=${NODE_ENV}
      - POSTGRES_USER=${DB_ADMIN}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASS}
      - POSTGRES_DB=${DB_DATABASE}
      - PORT=5432
      - PGDATA=${PGDATA}/${POSTGRES_VERSION}
    networks:
      - biohubbc-network
    volumes:
      - postgres:${PGDATA}

  ## Build the api docker image
  api:
    image: ${DOCKER_PROJECT_NAME}-api-${DOCKER_NAMESPACE}-img
    container_name: ${DOCKER_PROJECT_NAME}-api-${DOCKER_NAMESPACE}-container
    build:
      context: ./api
      dockerfile: ./.docker/api/Dockerfile
    ports:
      - ${API_PORT}:${API_PORT}
    environment:
      - NODE_ENV=${NODE_ENV}
      - NODE_OPTIONS=${API_NODE_OPTIONS}
      - API_RESPONSE_VALIDATION_ENABLED=${API_RESPONSE_VALIDATION_ENABLED}
      - DATABASE_RESPONSE_VALIDATION_ENABLED=${DATABASE_RESPONSE_VALIDATION_ENABLED}
      # ITIS API
      - ITIS_SOLR_URL=${ITIS_SOLR_URL}
      - ITIS_TSN_LOOKUP_BATCH_SIZE=${ITIS_TSN_LOOKUP_BATCH_SIZE}
      - ITIS_TSN_LOOKUP_DELAY_MS=${ITIS_TSN_LOOKUP_DELAY_MS}
      - TZ=${API_TZ}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - DB_HOST=${DB_HOST}
      - DB_USER_API=${DB_USER_API}
      - DB_USER_API_PASS=${DB_USER_API_PASS}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_POOL_SIZE=${DB_POOL_SIZE}
      - DB_CONNECTION_MAX_USES=${DB_CONNECTION_MAX_USES}
      - DB_CONNECTION_TIMEOUT=${DB_CONNECTION_TIMEOUT}
      - DB_IDLE_TIMEOUT=${DB_IDLE_TIMEOUT}
      # Keycloak
      - KEYCLOAK_HOST=${KEYCLOAK_HOST}
      - KEYCLOAK_REALM=${KEYCLOAK_REALM}
      # Keycloak Service client
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USERNAME}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Keycloak CSS API
      - KEYCLOAK_API_TOKEN_URL=${KEYCLOAK_API_TOKEN_URL}
      - KEYCLOAK_API_CLIENT_ID=${KEYCLOAK_API_CLIENT_ID}
      - KEYCLOAK_API_CLIENT_SECRET=${KEYCLOAK_API_CLIENT_SECRET}
      - KEYCLOAK_API_HOST=${KEYCLOAK_API_HOST}
      - KEYCLOAK_API_ENVIRONMENT=${KEYCLOAK_API_ENVIRONMENT}
      # Object Store (S3)
      - OBJECT_STORE_URL=${OBJECT_STORE_URL}
      - OBJECT_STORE_URL_PUBLIC=${OBJECT_STORE_URL_PUBLIC}
      - OBJECT_STORE_ACCESS_KEY_ID=${OBJECT_STORE_ACCESS_KEY_ID}
      - OBJECT_STORE_SECRET_KEY_ID=${OBJECT_STORE_SECRET_KEY_ID}
      - OBJECT_STORE_BUCKET_NAME=${OBJECT_STORE_BUCKET_NAME}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX}
      # Quarantine Object Store (S3)
      - QUARANTINE_OBJECT_STORE_URL_PUBLIC=${QUARANTINE_OBJECT_STORE_URL_PUBLIC}
      - QUARANTINE_OBJECT_STORE_URL=${QUARANTINE_OBJECT_STORE_URL}
      - QUARANTINE_OBJECT_STORE_ACCESS_KEY_ID=${QUARANTINE_OBJECT_STORE_ACCESS_KEY_ID}
      - QUARANTINE_OBJECT_STORE_SECRET_KEY_ID=${QUARANTINE_OBJECT_STORE_SECRET_KEY_ID}
      - QUARANTINE_OBJECT_STORE_BUCKET_NAME=${QUARANTINE_OBJECT_STORE_BUCKET_NAME}
      - MAX_REQ_BODY_SIZE=${MAX_REQ_BODY_SIZE}
      - MAX_UPLOAD_NUM_FILES=${MAX_UPLOAD_NUM_FILES}
      - MAX_UPLOAD_FILE_SIZE=${MAX_UPLOAD_FILE_SIZE}
      # Upload pipeline (multipart planner)
      - UPLOAD_TARGET_PART_COUNT=${UPLOAD_TARGET_PART_COUNT}
      - UPLOAD_PART_SIZE_CAP_BYTES=${UPLOAD_PART_SIZE_CAP_BYTES}
      - UPLOAD_PART_SIZE_SCALE_START_BYTES=${UPLOAD_PART_SIZE_SCALE_START_BYTES}
      - UPLOAD_PART_SIZE_SCALE_STEP_BYTES=${UPLOAD_PART_SIZE_SCALE_STEP_BYTES}
      - UPLOAD_PART_SIZE_SCALE_STEP_INCREMENT_BYTES=${UPLOAD_PART_SIZE_SCALE_STEP_INCREMENT_BYTES}
      - UPLOAD_PRESIGNED_URL_BATCH_SIZE=${UPLOAD_PRESIGNED_URL_BATCH_SIZE}
      - UPLOAD_PRESIGNED_URL_EXPIRY_SECONDS=${UPLOAD_PRESIGNED_URL_EXPIRY_SECONDS}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_LEVEL_FILE=${LOG_LEVEL_FILE}
      - LOG_FILE_DIR=${LOG_FILE_DIR}
      - LOG_FILE_NAME=${LOG_FILE_NAME}
      - LOG_FILE_DATE_PATTERN=${LOG_FILE_DATE_PATTERN}
      - LOG_FILE_MAX_SIZE=${LOG_FILE_MAX_SIZE}
      - LOG_FILE_MAX_FILES=${LOG_FILE_MAX_FILES}
      # Tile tokens (the api holds the PRIVATE key; only it can mint tokens)
      - MARTIN_TOKEN_PRIVATE_KEY_PATH=/var/martin-keys/private/${MARTIN_TOKEN_KID}.pem
      - MARTIN_TOKEN_KID=${MARTIN_TOKEN_KID}
      - MARTIN_TOKEN_AUD=${MARTIN_TOKEN_AUD}
      - MARTIN_TOKEN_ISS=${MARTIN_TOKEN_ISS}
      - MARTIN_TOKEN_TTL_SECONDS=${MARTIN_TOKEN_TTL_SECONDS}
      - MARTIN_EXTERNAL_URL=${MARTIN_EXTERNAL_URL}
      - MARTIN_MINT_RATE_LIMIT=${MARTIN_MINT_RATE_LIMIT}
      - MARTIN_MINT_RATE_LIMIT_WINDOW_MINUTES=${MARTIN_MINT_RATE_LIMIT_WINDOW_MINUTES}
      # Clamav
      - CLAMAV_PORT=${CLAMAV_PORT}
      - CLAMAV_HOST=${CLAMAV_HOST}
      - ENABLE_FILE_VIRUS_SCAN=${ENABLE_FILE_VIRUS_SCAN}
      - CLAMAV_MAX_SCAN_SIZE=${CLAMAV_MAX_SCAN_SIZE}
      # GCNotify
      - GCNOTIFY_SECRET_API_KEY=${GCNOTIFY_SECRET_API_KEY}
      - GCNOTIFY_ADMIN_EMAIL=${GCNOTIFY_ADMIN_EMAIL}
      - GCNOTIFY_REQUEST_ACCESS_SECURE_DOCUMENTS=${GCNOTIFY_REQUEST_ACCESS_SECURE_DOCUMENTS}
      - GCNOTIFY_ONBOARDING_REQUEST_EMAIL_TEMPLATE=${GCNOTIFY_ONBOARDING_REQUEST_EMAIL_TEMPLATE}
      - GCNOTIFY_ONBOARDING_REQUEST_SMS_TEMPLATE=${GCNOTIFY_ONBOARDING_REQUEST_SMS_TEMPLATE}
      - GCNOTIFY_EMAIL_URL=${GCNOTIFY_EMAIL_URL}
      - GCNOTIFY_SMS_URL=${GCNOTIFY_SMS_URL}
      - APP_HOST=${APP_HOST}
    volumes:
      - ./api:/opt/app-root/src
      - /opt/app-root/src/node_modules # prevents local node_modules overriding container node_modules
      - martin_keys:/var/martin-keys:ro
    networks:
      - biohubbc-network
    depends_on:
      db:
        condition: service_healthy
      db_setup:
        condition: service_completed_successfully
      # The api signs tile tokens with the locally generated private key
      martin_keys_setup:
        condition: service_completed_successfully

  ## Build the queue worker docker image
  queue:
    image: ${DOCKER_PROJECT_NAME}-queue-${DOCKER_NAMESPACE}-img
    container_name: ${DOCKER_PROJECT_NAME}-queue-${DOCKER_NAMESPACE}-container
    build:
      context: ./api
      dockerfile: ./.docker/api/Dockerfile
    command: npm run queue-reload
    environment:
      - NODE_ENV=${NODE_ENV}
      - TZ=${API_TZ}
      # ITIS API
      - ITIS_SOLR_URL=${ITIS_SOLR_URL}
      - ITIS_TSN_LOOKUP_BATCH_SIZE=${ITIS_TSN_LOOKUP_BATCH_SIZE}
      - ITIS_TSN_LOOKUP_DELAY_MS=${ITIS_TSN_LOOKUP_DELAY_MS}
      # Clamav
      - CLAMAV_HOST=${CLAMAV_HOST}
      - CLAMAV_PORT=${CLAMAV_PORT}
      - CLAMAV_MAX_SCAN_SIZE=${CLAMAV_MAX_SCAN_SIZE}
      # Database
      - DB_HOST=${DB_HOST}
      - DB_USER_API=${DB_USER_API}
      - DB_USER_API_PASS=${DB_USER_API_PASS}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_POOL_SIZE=${DB_POOL_SIZE}
      - DB_CONNECTION_MAX_USES=${DB_CONNECTION_MAX_USES}
      - DB_CONNECTION_TIMEOUT=${DB_CONNECTION_TIMEOUT}
      - DB_IDLE_TIMEOUT=${DB_IDLE_TIMEOUT}
      # Object Store (S3)
      - OBJECT_STORE_URL=${OBJECT_STORE_URL}
      - OBJECT_STORE_URL_PUBLIC=${OBJECT_STORE_URL_PUBLIC}
      - OBJECT_STORE_ACCESS_KEY_ID=${OBJECT_STORE_ACCESS_KEY_ID}
      - OBJECT_STORE_SECRET_KEY_ID=${OBJECT_STORE_SECRET_KEY_ID}
      - OBJECT_STORE_BUCKET_NAME=${OBJECT_STORE_BUCKET_NAME}
      - S3_KEY_PREFIX=${S3_KEY_PREFIX}
      # Quarantine Object Store (S3)
      - QUARANTINE_OBJECT_STORE_URL=${QUARANTINE_OBJECT_STORE_URL}
      - QUARANTINE_OBJECT_STORE_ACCESS_KEY_ID=${QUARANTINE_OBJECT_STORE_ACCESS_KEY_ID}
      - QUARANTINE_OBJECT_STORE_SECRET_KEY_ID=${QUARANTINE_OBJECT_STORE_SECRET_KEY_ID}
      - QUARANTINE_OBJECT_STORE_BUCKET_NAME=${QUARANTINE_OBJECT_STORE_BUCKET_NAME}
      # Ingestion pipeline
      - INGESTION_FEATURE_BATCH_SIZE=${INGESTION_FEATURE_BATCH_SIZE}
      - INGESTION_CONTRIBUTOR_CODE_BATCH_SIZE=${INGESTION_CONTRIBUTOR_CODE_BATCH_SIZE}
      - INGESTION_MEDIA_BATCH_FILES=${INGESTION_MEDIA_BATCH_FILES}
      - INGESTION_MEDIA_BATCH_BYTES=${INGESTION_MEDIA_BATCH_BYTES}
      # Security scope
      - SECURITY_SCOPE_ANCHOR_BATCH_SIZE=${SECURITY_SCOPE_ANCHOR_BATCH_SIZE}
      # Upload pipeline (archive ingestion)
      - UPLOAD_FEATURE_BATCH_MAX_BYTES=${UPLOAD_FEATURE_BATCH_MAX_BYTES}
      - UPLOAD_ARCHIVE_MEDIA_CONCURRENCY=${UPLOAD_ARCHIVE_MEDIA_CONCURRENCY}
      - UPLOAD_JOB_BATCH_SIZE=${UPLOAD_JOB_BATCH_SIZE}
      - UPLOAD_ARCHIVE_JSON_FILE_MAX_BYTES=${UPLOAD_ARCHIVE_JSON_FILE_MAX_BYTES}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./api:/opt/app-root/src
      - /opt/app-root/src/node_modules
    networks:
      - biohubbc-network
    depends_on:
      db:
        condition: service_healthy
      # Note: db_setup dependency removed - queue is meant to run after make web/backend

  # Build the clamav docker image
  clamav:
    image: clamav/clamav-debian:latest
    container_name: ${DOCKER_PROJECT_NAME}-clamav-${DOCKER_NAMESPACE}-container
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'conf="/etc/clamav/clamd.conf"; max_scan_size="$${CLAMAV_MAX_SCAN_SIZE:-2147483648}"; set_conf_value() { key="$$1"; value="$$2"; if grep -Eq "^#?$${key}[[:space:]]+" "$$conf"; then sed -i -E "s|^#?$${key}[[:space:]].*|$${key} $${value}|" "$$conf"; else echo "$${key} $${value}" >> "$$conf"; fi; }; set_conf_value "StreamMaxLength" "$$max_scan_size"; set_conf_value "MaxFileSize" "$$max_scan_size"; set_conf_value "MaxScanSize" "$$max_scan_size"; freshclam || true; exec clamd -F;'
    ports:
      - ${CLAMAV_PORT}:3310
    environment:
      - CLAMAV_MAX_SCAN_SIZE=${CLAMAV_MAX_SCAN_SIZE}
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - biohubbc-network
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s  # ClamAV takes ~2 min to load virus definitions

  ## MinIO - S3-compatible object storage for local development
  minio:
    image: minio/minio:latest
    container_name: ${DOCKER_PROJECT_NAME}-minio-${DOCKER_NAMESPACE}-container
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${OBJECT_STORE_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${OBJECT_STORE_SECRET_KEY_ID}
    volumes:
      - minio_data:/data
    networks:
      - biohubbc-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  ## MinIO bucket initialization
  minio_setup:
    image: minio/mc:latest
    container_name: ${DOCKER_PROJECT_NAME}-minio-setup-${DOCKER_NAMESPACE}-container
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - biohubbc-network
    entrypoint: >
      /bin/sh -c "
      set -e;

      mc alias set myminio http://minio:9000 ${OBJECT_STORE_ACCESS_KEY_ID} ${OBJECT_STORE_SECRET_KEY_ID};

      mc mb --ignore-existing myminio/${OBJECT_STORE_BUCKET_NAME};
      mc mb --ignore-existing myminio/${QUARANTINE_OBJECT_STORE_BUCKET_NAME};

      mc admin config set myminio api \
        cors_allow_origin='*' \
        cors_allow_methods='GET,PUT,POST,DELETE,HEAD' \
        cors_allow_headers='*' \
        cors_expose_headers='ETag' \
        cors_max_age=3000;

      echo 'Buckets created and global CORS configured successfully';
      "


  ## Build the app docker image
  app:
    image: ${DOCKER_PROJECT_NAME}-app-${DOCKER_NAMESPACE}-img
    container_name: ${DOCKER_PROJECT_NAME}-app-${DOCKER_NAMESPACE}-container
    build:
      context: ./app
      dockerfile: ./.docker/app/Dockerfile
    stdin_open: true
    ports:
      - ${APP_PORT}:${APP_PORT}
    environment:
      - VITE_NODE_OPTIONS=${APP_NODE_OPTIONS}
      - VITE_CHANGE_VERSION="1.0"
      - VITE_NODE_ENV=${NODE_ENV}
      - VITE_PORT=${APP_PORT}
      - VITE_API_HOST=${API_HOST}
      - VITE_API_PORT=${API_PORT}
      - VITE_MAX_UPLOAD_NUM_FILES=${MAX_UPLOAD_NUM_FILES}
      - VITE_MAX_UPLOAD_FILE_SIZE=${MAX_UPLOAD_FILE_SIZE}
      - VITE_MAX_UPLOAD_TARBALL_SIZE=${MAX_UPLOAD_TARBALL_SIZE}
      - VITE_MAX_TICKET_ATTACHMENT_FILE_SIZE=${MAX_TICKET_ATTACHMENT_FILE_SIZE}
      - VITE_SITEMINDER_LOGOUT_URL=${SITEMINDER_LOGOUT_URL}
      - VITE_KEYCLOAK_HOST=${KEYCLOAK_HOST}
      - VITE_KEYCLOAK_REALM=${KEYCLOAK_REALM}
      - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
    volumes:
      - ./app:/opt/app-root/src
      - /opt/app-root/src/node_modules # prevents local node_modules overriding container node_modules
    networks:
      - biohubbc-network

  ## Generate the local tile token signing keypair (one-shot, idempotent)
  ## In OpenShift these come from the martin-token-private / martin-token-public Secrets instead.
  martin_keys_setup:
    image: alpine/openssl:latest
    container_name: ${DOCKER_PROJECT_NAME}-martin-keys-setup-${DOCKER_NAMESPACE}-container
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'mkdir -p /keys/private /keys/public;
        if [ ! -f "/keys/private/${MARTIN_TOKEN_KID}.pem" ]; then
        echo "Generating tile token keypair (kid=${MARTIN_TOKEN_KID})...";
        openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "/keys/private/${MARTIN_TOKEN_KID}.pem";
        openssl rsa -pubout -in "/keys/private/${MARTIN_TOKEN_KID}.pem" -out "/keys/public/${MARTIN_TOKEN_KID}.pem";
        chmod -R a+r /keys;
        echo "Tile token keypair generated.";
        else echo "Tile token keypair already exists, skipping."; fi'
    volumes:
      - martin_keys:/keys
    networks:
      - biohubbc-network

  ## Authenticating gateway that fronts Martin. The only public entry point for tiles.
  martin_gateway:
    image: ${DOCKER_PROJECT_NAME}-martin-gateway-${DOCKER_NAMESPACE}-img
    container_name: ${DOCKER_PROJECT_NAME}-martin-gateway-${DOCKER_NAMESPACE}-container
    build:
      context: ./martin-gateway
      dockerfile: ./.docker/martin-gateway/Dockerfile
    ports:
      - ${MARTIN_GATEWAY_PORT}:${MARTIN_GATEWAY_PORT}
    environment:
      - NODE_ENV=${NODE_ENV}
      - MARTIN_GATEWAY_PORT=${MARTIN_GATEWAY_PORT}
      - MARTIN_URL=http://martin:3000
      # Only the PUBLIC keys are needed to verify tokens; the gateway can never mint one.
      - MARTIN_TOKEN_PUBLIC_KEY_DIR=/var/martin-keys/public
      # The kid the api signs with; startup asserts a matching public key file is present.
      - MARTIN_TOKEN_KID=${MARTIN_TOKEN_KID}
      - MARTIN_TOKEN_AUD=${MARTIN_TOKEN_AUD}
      - MARTIN_TOKEN_ISS=${MARTIN_TOKEN_ISS}
      - MARTIN_ALLOWED_SOURCES=${MARTIN_ALLOWED_SOURCES}
      - MARTIN_MIN_ZOOM=${MARTIN_MIN_ZOOM}
      - MARTIN_MAX_ZOOM=${MARTIN_MAX_ZOOM}
      - MARTIN_CACHE_TTL_SECONDS=${MARTIN_CACHE_TTL_SECONDS}
      - MARTIN_CACHE_MAX_BYTES=${MARTIN_CACHE_MAX_BYTES}
      - MARTIN_SOURCE_VERSION=${MARTIN_SOURCE_VERSION}
      - RATE_LIMIT_JTI_PER_MIN=${RATE_LIMIT_JTI_PER_MIN}
      - RATE_LIMIT_IP_PER_MIN=${RATE_LIMIT_IP_PER_MIN}
      - ALLOWED_ORIGIN=${APP_HOST}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./martin-gateway:/opt/app-root/src
      - /opt/app-root/src/node_modules # prevents local node_modules overriding container node_modules
      - martin_keys:/var/martin-keys:ro
    networks:
      - biohubbc-network
    depends_on:
      martin:
        condition: service_healthy
      martin_keys_setup:
        condition: service_completed_successfully

  ## Martin vector tile server (serves vector tiles directly from PostGIS)
  martin:
    image: ghcr.io/maplibre/martin:${MARTIN_VERSION}
    container_name: ${DOCKER_PROJECT_NAME}-martin-${DOCKER_NAMESPACE}-container
    ports:
      - ${MARTIN_PORT}:3000
    command: ["--config", "/etc/martin/config.yaml"]
    environment:
      # Martin expands ${DATABASE_URL} itself, inside the config file
      - DATABASE_URL=postgresql://${DB_USER_MARTIN}:${DB_USER_MARTIN_PASS}@${DB_HOST}:5432/${DB_DATABASE}
    configs:
      - source: martin-config
        target: /etc/martin/config.yaml
    networks:
      - biohubbc-network
    depends_on:
      db:
        condition: service_healthy
      # The martin role is created by the migrations
      db_setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ## Run the database migrations and seeding
  db_setup:
    image: ${DOCKER_PROJECT_NAME}-db-setup-${DOCKER_NAMESPACE}-img
    container_name: ${DOCKER_PROJECT_NAME}-db-setup-${DOCKER_NAMESPACE}-container
    build:
      context: ./database
      dockerfile: ./.docker/db/Dockerfile.setup
    environment:
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=${DB_HOST}
      - DB_ADMIN=${DB_ADMIN}
      - DB_ADMIN_PASS=${DB_ADMIN_PASS}
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE}
      - DB_SCHEMA=${DB_SCHEMA}
      - DB_USER_API=${DB_USER_API}
      - DB_USER_API_PASS=${DB_USER_API_PASS}
      # Used to create the least-privilege Martin tile server role
      - DB_USER_MARTIN=${DB_USER_MARTIN}
      - DB_USER_MARTIN_PASS=${DB_USER_MARTIN_PASS}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - CONTRIBUTOR_SYSTEM_USER_GUID=${CONTRIBUTOR_SYSTEM_USER_GUID}
      - ENABLE_MOCK_FEATURE_SEEDING=${ENABLE_MOCK_FEATURE_SEEDING}
      - NUM_MOCK_FEATURE_SUBMISSIONS=${NUM_MOCK_FEATURE_SUBMISSIONS}
    volumes:
      - /opt/app-root/src/node_modules # prevents local node_modules overriding container node_modules
    networks:
      - biohubbc-network
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "setup"]

configs:
  ## Martin vector tile server configuration (local development).
  ##
  ## Martin serves vector tiles directly from PostGIS; tile bytes never pass through the BioHub API:
  ##
  ##   MapLibre -> Martin Gateway (auth) -> Martin -> PostGIS
  ##
  ## IMPORTANT: keep this in sync with the Helm ConfigMap that renders the same configuration for
  ## OpenShift: infrastructure/martin/templates/configmap.yaml
  ##
  ## Config reference (pinned version): https://maplibre.org/martin/config-file/
  ## Schema: https://github.com/maplibre/martin/blob/main/schemas/config.json
  ##
  ## NOTE: `$$` escapes the `$` so Compose does NOT interpolate it. The literal `${DATABASE_URL}` is
  ## written into the container, and Martin expands it from the service environment at startup.
  martin-config:
    content: |
      # Bind on all interfaces so the port can be published to the host for local development.
      listen_addresses: 0.0.0.0:3000

      worker_processes: 2

      # Warn rather than abort when a configured source is invalid at startup. Keeps parity with the
      # OpenShift config, where Martin can start before the database-setup Job has created the tile
      # functions; locally compose ordering usually prevents this, but a stale db_setup image can
      # produce the same missing-function state.
      on_invalid: warn

      # Martin's built-in tile cache is enabled by default (512 MB) but holds entries with NO
      # expiry, only size-pressure eviction. Tiles are security filtered at render time, so an
      # unbounded entry lifetime would let a newly secured feature keep appearing in cached tiles
      # indefinitely. The expiry bounds that takedown window. Cache keys include the full query
      # string, so entries never leak across `context` values.
      cache:
        expiry: "5m"

      postgres:
        # Expanded by Martin from the DATABASE_URL environment variable set on the compose service.
        connection_string: $${DATABASE_URL}

        pool_size: 5

        # CRITICAL: disable automatic discovery. Left enabled, Martin publishes every table and
        # function its database role can read. Only sources explicitly listed here are served.
        auto_publish: false

networks:
  biohubbc-network:
    driver: bridge

volumes:
  postgres:
    name: ${DOCKER_PROJECT_NAME}-db-${DOCKER_NAMESPACE}-vol
  clamav_db:
    name: ${DOCKER_PROJECT_NAME}-clamav-${DOCKER_NAMESPACE}-vol
  minio_data:
    name: ${DOCKER_PROJECT_NAME}-minio-${DOCKER_NAMESPACE}-vol
  martin_keys:
    name: ${DOCKER_PROJECT_NAME}-martin-keys-${DOCKER_NAMESPACE}-vol
