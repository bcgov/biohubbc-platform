apiVersion: v2
name: biohub-platform
description: A Helm umbrella chart for Biohub Platform - deploys app, database, database-setup, and api in proper order
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: biohub-platform-app
    repository: file://../app
    version: 0.1.0
    condition: app.enabled
  - name: biohub-platform-db
    repository: file://../database
    version: 0.1.0
    condition: database.enabled
  - name: biohub-platform-db-setup
    repository: file://../database-setup
    version: 0.1.0
    condition: database-setup.enabled
    dependsOn:
      - biohub-platform-db
  - name: biohub-platform-api
    repository: file://../api
    version: 0.1.0
    condition: api.enabled
    dependsOn:
      - biohub-platform-db-setup
