apiVersion: v2
name: biohub-platform
description: A Helm umbrella chart for Biohub Platform - deploys app, database-setup, api, queue, and martin. For PR previews the database subchart (single-pod Postgres) is enabled; for static envs (dev/test/prod) database is disabled and Crunchy Postgres is deployed separately (see infrastructure/crunchy-db).
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: biohub-platform-app
    repository: file://../app
    version: 0.1.0
    condition: app.enabled
  - name: biohub-platform-db
    repository: file://../database
    version: 0.1.0
    condition: database.enabled
  - name: biohub-platform-db-setup
    repository: file://../database-setup
    version: 0.1.0
    condition: database-setup.enabled
  - name: biohub-platform-api
    repository: file://../api
    version: 0.1.0
    condition: api.enabled
    dependsOn:
      - biohub-platform-db-setup
  - name: biohub-platform-queue
    repository: file://../queue
    version: 0.1.0
    condition: queue.enabled
    dependsOn:
      - biohub-platform-db-setup
  - name: biohub-platform-martin
    repository: file://../martin
    version: 0.1.0
    condition: martin.enabled
    dependsOn:
      - biohub-platform-db-setup
