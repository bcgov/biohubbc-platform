# Default values for biohub-platform chart
# This is a YAML-formatted file.

# Global configuration
global:
  environment:
    licensePlate: "a0ec71"
    name: "" # Environment name (dev, test, prod)
    id: "" # Environment id (PR, deploy)
    changeId: "" # Change id (PR number)
    ts: "" # Timestamp of the deployment

# Component enablement flags
app:
  enabled: true

database:
  enabled: true

database-setup:
  enabled: true

api:
  enabled: true

martin:
  enabled: true

# Component-specific configurations
# These will be passed through to the individual charts
app:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any app-specific overrides here

database:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  app:
    name: biohub-platform-db
    nodeEnv: ""
    timezone: America/Vancouver
    postgresAdmin: ""
    postgresAdminPassword: ""
    postgresUser: ""
    postgresUserPassword: ""
    postgresUserApi: ""
    postgresUserApiPassword: ""
    postgresDb: ""
    pgData: /var/lib/postgresql/data/17
  # Add any database-specific overrides here

database-setup:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any database-setup-specific overrides here

api:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any api-specific overrides here

queue:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any queue-specific overrides here

# Values passed to the biohub-platform-martin subchart.
# NOTE: subchart values are routed by CHART NAME, so per-component settings must live under
# `biohub-platform-martin:`. The `martin:` key above only drives the `martin.enabled` condition.
biohub-platform-martin:
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""

# Values passed to biohub-platform-queue subchart
# Queue tuning overrides (optional)
biohub-platform-queue:
  app: {}
