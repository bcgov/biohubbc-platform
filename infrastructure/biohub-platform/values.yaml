# Default values for biohub-platform chart
# This is a YAML-formatted file.

# Global configuration
global:
  environment:
    licensePlate: "a0ec71"
    name: "" # Environment name (dev, test, prod)
    id: "" # Environment id (PR, deploy)
    changeId: "" # Change id (PR number)
    ts: "" # Timestamp of the deployment

  martin:
    # Key id for the RS256 tile token key pair. THE api SIGNS WITH IT AND THE GATEWAY VERIFIES
    # AGAINST IT, so the two must never disagree - a mismatch leaves both pods healthy while every
    # tile 401s. Declared once here, as a Helm global, precisely so there is no second copy to
    # forget: both subcharts read it, falling back to their own value only when rendered standalone.
    #
    # It is also the FILE NAME inside the martin-token-public secret (`<keyId>.pem`); the gateway
    # refuses to boot if no such file is mounted. Rotation: publish the new public key, roll the
    # gateway, then change this one value. See infrastructure/martin/README.md.
    keyId: "2026-07"

# Component configuration, passed through to the individual charts. Each key also carries the
# `enabled` flag its Chart.yaml dependency condition reads.
#
# NOTE: one block per component. A second `app:`/`database:`/... block would silently win over the
# first, because YAML keeps only the last occurrence of a duplicated key.
app:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any app-specific overrides here

database:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  app:
    name: biohub-platform-db
    nodeEnv: ""
    timezone: America/Vancouver
    postgresAdmin: ""
    postgresAdminPassword: ""
    postgresUser: ""
    postgresUserPassword: ""
    postgresUserApi: ""
    postgresUserApiPassword: ""
    postgresDb: ""
    pgData: /var/lib/postgresql/data/17
  # Add any database-specific overrides here

database-setup:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any database-setup-specific overrides here

api:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any api-specific overrides here

queue:
  enabled: true
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""
  # Add any queue-specific overrides here

# Drives the `martin.enabled` dependency condition only. Martin's own settings are routed by CHART
# name, so they live under `biohub-platform-martin:` below.
martin:
  enabled: true

# Values passed to the biohub-platform-martin subchart.
# NOTE: subchart values are routed by CHART NAME, so per-component settings must live under
# `biohub-platform-martin:`. The `martin:` key above only drives the `martin.enabled` condition.
biohub-platform-martin:
  environment:
    licensePlate: "a0ec71"
    name: ""
    id: ""
    changeId: ""
    ts: ""

# Values passed to biohub-platform-queue subchart
# Queue tuning overrides (optional)
biohub-platform-queue:
  app: {}
