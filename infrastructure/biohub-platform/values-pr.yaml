# PR environment values for biohub-platform chart
environment:
  name: dev
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

database:
  enabled: true

database-setup:
  enabled: true

api:
  enabled: true

queue:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    # apiHost will be dynamically set: "biohub-platform-api-1234-a0ec71-dev.apps.silver.devops.gov.bc.ca"

    # Siteminder
    siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi

  # Route configuration
  # route.host will be dynamically set: "biohub-platform-1234-a0ec71-dev.apps.silver.devops.gov.bc.ca"

# Values passed to biohub-platform-db subchart
biohub-platform-db:
  environment:
    licensePlate: "a0ec71"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    postgresAdmin: ""
    postgresAdminPassword: ""
    postgresUser: ""
    postgresUserPassword: ""
    postgresUserApi: ""
    postgresUserApiPassword: ""
    postgresDb: ""

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 2Gi

  # Volume for persistent data
  persistence:
    size: 500Mi  # Smaller for PR environments

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    database:
      useCrunchy: false # PRs use legacy dbHost secret

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=2250 # 75% of memoryLimit (bytes)
    # appHost will be dynamically set: "biohub-platform-app-1234-a0ec71-dev.apps.silver.devops.gov.bc.ca"
    database:
      useCrunchy: false # PRs use legacy dbHost secret
    
    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: dev

    # Object Store (S3)
    # objectStore.keyPrefix will be dynamically set: "local/1234/sims"

    # Logging
    logging:
      level: debug
      levelFile: debug
      fileMaxFiles: 2  # Smaller for PR environments

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 600m
      memory: 3Gi

  # Volume for logs and persistent data
  persistence:
    size: 100Mi  # Smaller for PR environments

  # Route configuration (OpenShift)
  # route.host will be dynamically set: "biohub-platform-api-1234-a0ec71-dev.apps.silver.devops.gov.bc.ca"

# Values passed to biohub-platform-queue subchart
biohub-platform-queue:
  environment:
    licensePlate: "a0ec71"
    name: dev
    # id will be dynamically set: "1234"
    # changeId will be dynamically set: "1234"
    ts: ""

  # Queue worker configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=512
    # objectStore.keyPrefix will be dynamically set: "local/1234/biohub"
    database:
      useCrunchy: false # PRs use legacy dbHost secret

    # Clamav
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # Logging
    logging:
      level: debug
      levelFile: debug
      fileMaxFiles: 2  # Smaller for PR environments
    # Ingestion/security/upload tuning (optional queue overrides)
    # ingestion:
    #   featureBatchSize: "10000"
    #   contributorCodeBatchSize: ""
    #   mediaBatchBytes: ""
    #   mediaBatchFiles: ""
    # security:
    #   scopeAnchorBatchSize: "5000"
    # uploadIngestion:
    #   featureBatchMaxBytes: "52428800"
    #   mediaConcurrency: ""
    #   jobBatchSize: ""
    #   jsonFileMaxBytes: "104857600"

  # Openshift Resources
  # Workers can scale horizontally - maintenance is handled by queue-supervisor
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 512Mi

# Values passed to biohub-platform-martin subchart
biohub-platform-martin:
  environment:
    licensePlate: "a0ec71"
    name: dev
    ts: ""
  app:
    database:
      # PR environments use the legacy in-cluster Postgres, not Crunchy. The martin role is
      # created by the database migration from the biohub-platform-db secret.
      useCrunchy: false
  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  # route.host intentionally omitted: the chart derives the per-PR app hostname, so /tiles always
  # lands on the same host as that PR's frontend.
  route:
    path: /tiles
  gateway:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
