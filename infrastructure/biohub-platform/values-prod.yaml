# Production environment values for biohub-platform chart
environment:
  name: prod
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

# Disabled: PROD uses the separate Crunchy Postgres Helm release (infrastructure/crunchy-db).
database:
  enabled: false

database-setup:
  enabled: true

api:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production
    apiHost: api-biohub-platform.apps.silver.devops.gov.bc.ca

    # Siteminder
    siteminderLogoutURL: "https://logon7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://loginproxy.gov.bc.ca/auth"
    
  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Route configuration
  route:
    host: biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production
    database:
      useCrunchy: true
      host: "biohub-platform-db-prod-pgbouncer"
      migrationHost: "biohub-platform-db-prod-primary"
      adminSecretName: "biohub-platform-db-prod-pguser-postgres"
      adminUserKey: "user"
      adminPasswordKey: "password"
      # Legacy deploy secret (has database-user-api=biohub_api and database-user-api-password)
      appSecretName: "biohub-platform-db-prod"
      appUserKey: "database-user-api"
      appPasswordKey: "database-user-api-password"
      dbNameSecretName: "biohub-platform-db-prod"
      dbNameKey: "database-name"

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: production
    nodeOptions: --max_old_space_size=4500  # 75% of 6Gi memory limit
    appHost: biohub-platform.apps.silver.devops.gov.bc.ca

    # Keycloak
    keycloak:
      host: "https://loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: prod

    database:
      useCrunchy: true
      host: "biohub-platform-db-prod-pgbouncer"
      port: 5432
      appSecretName: "biohub-platform-db-prod"
      appUserKey: "database-user-api"
      appPasswordKey: "database-user-api-password"
      dbNameSecretName: "biohub-platform-db-prod"
      dbNameKey: "database-name"
      adminSecretName: "biohub-platform-db-prod-pguser-postgres"
      adminUserKey: "user"
      adminPasswordKey: "password"

    # Object Store (S3)
    objectStore:
      keyPrefix: biohub

    # Logging
    logging:
      level: silent
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 1500m
      memory: 6Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohub-platform-api-prod"

  # Route configuration (OpenShift)
  route:
    host: api-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-queue subchart
biohub-platform-queue:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set
    ts: ""

  # Queue worker configuration
  app:
    nodeEnv: production
    nodeOptions: --max_old_space_size=1024
    # objectStore.keyPrefix will be dynamically set: "biohub"

    database:
      useCrunchy: true
      host: "biohub-platform-db-prod-pgbouncer"
      port: 5432
      appSecretName: "biohub-platform-db-prod"
      appUserKey: "database-user-api"
      appPasswordKey: "database-user-api-password"
      dbNameSecretName: "biohub-platform-db-prod"
      dbNameKey: "database-name"
      adminSecretName: "biohub-platform-db-prod-pguser-postgres"
      adminUserKey: "user"
      adminPasswordKey: "password"

    # Clamav
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # Logging
    logging:
      level: silent
      levelFile: debug
      fileMaxFiles: 30

  # Openshift Resources
  # Workers can scale horizontally - maintenance is handled by queue-supervisor
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
