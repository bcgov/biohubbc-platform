# Production environment values for biohub-platform chart
environment:
  name: prod
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

# Disabled: PROD uses the separate Crunchy Postgres Helm release (infrastructure/crunchy-db).
database:
  enabled: false

database-setup:
  enabled: true

api:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production
    apiHost: api-biohub-platform.apps.silver.devops.gov.bc.ca

    # Siteminder
    siteminderLogoutURL: "https://logon7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://loginproxy.gov.bc.ca/auth"
    
  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Route configuration
  route:
    host: biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production

    # Database
    database:
      host: "biohub-platform-db-prod-primary"
      adminSecretName: "biohub-platform-db-prod-pguser-postgres"
      appSecretName: "biohub-platform-db-prod-pguser-biohub-api"
      dbNameSecretName: "biohub-platform-db-prod-pguser-biohub-platform-db-prod"

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    # Tile token minting. Explicit per-environment opt-in: enabling mounts the martin-token-private
    # secret, which must exist in this namespace before this is turned on
    # (see infrastructure/martin/README.md). Chart default is off.
    martin:
      enabled: true
    nodeEnv: production
    nodeOptions: --max_old_space_size=4500  # 75% of 6Gi memory limit
    appHost: biohub-platform.apps.silver.devops.gov.bc.ca

    # Keycloak
    keycloak:
      host: "https://loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: prod

    # Database
    database:
      host: "biohub-platform-db-prod-primary"
      adminSecretName: "biohub-platform-db-prod-pguser-postgres"
      appSecretName: "biohub-platform-db-prod-pguser-biohub-api"
      dbNameSecretName: "biohub-platform-db-prod-pguser-biohub-platform-db-prod"

    # Object Store (S3)
    objectStore:
      keyPrefix: biohub

    # Logging
    logging:
      level: silent
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 1500m
      memory: 6Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohub-platform-api-prod"

  # Route configuration (OpenShift)
  route:
    host: api-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-queue subchart
biohub-platform-queue:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set
    ts: ""

  # Queue worker configuration
  app:
    nodeEnv: production
    nodeOptions: --max_old_space_size=1024
    # objectStore.keyPrefix will be dynamically set: "biohub"

    # Database
    database:
      host: "biohub-platform-db-prod-primary"
      adminSecretName: "biohub-platform-db-prod-pguser-postgres"
      appSecretName: "biohub-platform-db-prod-pguser-biohub-api"
      dbNameSecretName: "biohub-platform-db-prod-pguser-biohub-platform-db-prod"

    # Clamav
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # Logging
    logging:
      level: silent
      levelFile: debug
      fileMaxFiles: 30
    # Ingestion/security/upload tuning (optional queue overrides)
    # ingestion:
    #   featureBatchSize: "10000"
    #   contributorCodeBatchSize: ""
    #   mediaBatchBytes: ""
    #   mediaBatchFiles: ""
    # security:
    #   scopeAnchorBatchSize: "5000"
    # uploadIngestion:
    #   featureBatchMaxBytes: "52428800"
    #   mediaConcurrency: ""
    #   jobBatchSize: ""
    #   jsonFileMaxBytes: "104857600"

  # Openshift Resources
  # Workers can scale horizontally - maintenance is handled by queue-supervisor
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Values passed to biohub-platform-martin subchart
biohub-platform-martin:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    ts: ""
  app:
    database:
      useCrunchy: true
      host: biohub-platform-db-prod-primary
      martinSecretName: biohub-platform-db-prod-pguser-martin
      dbNameSecretName: biohub-platform-db-prod-pguser-biohub-platform-db-prod
  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  # Martin Gateway sidecar. Served on /martin of the app hostname, so tiles are same origin.
  route:
    host: biohub-platform.apps.silver.devops.gov.bc.ca
    path: /martin
  gateway:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 256Mi
