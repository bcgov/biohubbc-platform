# Production environment values for biohub-platform chart
environment:
  name: prod
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

database:
  enabled: true

database-setup:
  enabled: true

clamav:
  enabled: true

api:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production
    apiHost: api-biohub-platform.apps.silver.devops.gov.bc.ca

    # Siteminder
    siteminderLogoutURL: "https://logon7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://loginproxy.gov.bc.ca/auth"
    
  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # Route configuration
  route:
    host: biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-db subchart
biohub-platform-db:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 1500m
      memory: 6Gi

  # Volume for persistent data
  persistence:
    existingClaim: "biohub-platform-db-postgresql-prod"

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production

# Values passed to biohub-platform-clamav subchart
biohub-platform-clamav:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    ts: ""

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
    limits:
      cpu: 1100m
      memory: 2Gi

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: production
    nodeOptions: --max_old_space_size=4500  # 75% of 6Gi memory limit
    appHost: biohub-platform.apps.silver.devops.gov.bc.ca

    # Keycloak
    keycloak:
      host: "https://loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: prod

    # Object Store (S3)
    objectStore:
      keyPrefix: biohub

    # ClamAV
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # Logging
    logging:
      level: silent
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 1500m
      memory: 6Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohub-platform-api-prod"

  # Route configuration (OpenShift)
  route:
    host: api-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-queue subchart
biohub-platform-queue:
  environment:
    licensePlate: "a0ec71"
    name: prod
    id: deploy
    # changeId will be dynamically set
    ts: ""

  # Queue worker configuration
  app:
    nodeEnv: production
    nodeOptions: --max_old_space_size=1024
    # objectStore.keyPrefix will be dynamically set: "biohub"

    # Clamav
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # Logging
    logging:
      level: silent
      levelFile: debug
      fileMaxFiles: 30

  # Openshift Resources
  # Workers can scale horizontally - maintenance is handled by queue-supervisor
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
