# Test environment values for biohub-platform chart
environment:
  name: test
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

database:
  enabled: true

database-setup:
  enabled: true

api:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: test
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production
    apiHost: api-test-biohub-platform.apps.silver.devops.gov.bc.ca

    # Siteminder
    siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://test.loginproxy.gov.bc.ca/auth"
    
  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 400m
      memory: 750Mi

  # Route configuration
  route:
    host: test-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-db subchart
biohub-platform-db:
  environment:
    licensePlate: "a0ec71"
    name: test
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production # This is set to production as test is not a valid name in the Knexfile
    postgresAdmin: ""
    postgresAdminPassword: ""
    postgresUser: ""
    postgresUserPassword: ""
    postgresUserApi: ""
    postgresUserApiPassword: ""
    postgresDb: ""

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 1500m
      memory: 5Gi

  # Volume for persistent data
  persistence:
    existingClaim: "biohub-platform-db-postgresql-test"

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: test
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: production # This is set to production as test is not a valid name in the Knexfile

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: test
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: production
    nodeOptions: --max_old_space_size=3000 # 75% of memoryLimit (bytes)
    appHost: test-biohub-platform.apps.silver.devops.gov.bc.ca

    # Keycloak
    keycloak:
      host: "https://test.loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: test

    # Object Store (S3)
    objectStore:
      keyPrefix: biohub
      
    # Logging
    logging:
      level: warn
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 1250m
      memory: 4Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohub-platform-api-test"

  # Route configuration (OpenShift)
  route:
    host: api-test-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-queue subchart
biohub-platform-queue:
  environment:
    licensePlate: "a0ec71"
    name: test
    id: deploy
    # changeId will be dynamically set
    ts: ""

  # Queue worker configuration
  app:
    nodeEnv: production
    nodeOptions: --max_old_space_size=512
    # objectStore.keyPrefix will be dynamically set: "biohub"

    # Logging
    logging:
      level: warn
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  # Workers can scale horizontally - maintenance is handled by queue-supervisor
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 512Mi
