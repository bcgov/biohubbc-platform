# Development environment values for biohub-platform chart
environment:
  name: dev
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

# Disabled: DEV uses the separate Crunchy Postgres Helm release (infrastructure/crunchy-db).
database:
  enabled: false

database-setup:
  enabled: true

api:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""
  
  # App configuration
  app:
    nodeEnv: development
    apiHost: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca

    # Siteminder
    siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 300Mi

  # Route configuration
  route:
    host: dev-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development

    # Database
    database:
      host: "biohub-platform-db-dev-primary"
      adminSecretName: "biohub-platform-db-dev-pguser-postgres"
      appSecretName: "biohub-platform-db-dev-pguser-biohub-api"
      dbNameSecretName: "biohub-platform-db-dev-pguser-biohub-platform-db-dev"

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=2250 # 75% of memoryLimit (bytes)
    appHost: dev-biohub-platform.apps.silver.devops.gov.bc.ca

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: dev

    # Database
    database:
      host: "biohub-platform-db-dev-primary"
      port: 5432
      appSecretName: "biohub-platform-db-dev-pguser-biohub-api"
      dbNameSecretName: "biohub-platform-db-dev-pguser-biohub-platform-db-dev"
      adminSecretName: "biohub-platform-db-dev-pguser-postgres"

    # Object Store (S3)
    objectStore:
      keyPrefix: biohub

    # Logging
    logging:
      level: info
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 600m
      memory: 3Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohub-platform-api-dev-deploy"

  # Route configuration (OpenShift)
  route:
    host: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-queue subchart
biohub-platform-queue:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set
    ts: ""

  # Queue worker configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=512
    # objectStore.keyPrefix will be dynamically set: "biohub"

    # Database
    database:
      host: "biohub-platform-db-dev-primary"
      port: 5432
      appSecretName: "biohub-platform-db-dev-pguser-biohub-api"
      dbNameSecretName: "biohub-platform-db-dev-pguser-biohub-platform-db-dev"
      adminSecretName: "biohub-platform-db-dev-pguser-postgres"

    # Clamav
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # Logging
    logging:
      level: info
      levelFile: debug
      fileMaxFiles: 10
    # Ingestion/security/upload tuning (optional queue overrides)
    # ingestion:
    #   featureBatchSize: "10000"
    #   contributorCodeBatchSize: ""
    #   mediaBatchBytes: ""
    #   mediaBatchFiles: ""
    # security:
    #   scopeAnchorBatchSize: "5000"
    # uploadIngestion:
    #   featureBatchMaxBytes: "52428800"
    #   mediaConcurrency: ""
    #   jobBatchSize: ""
    #   jsonFileMaxBytes: "104857600"

  # Openshift Resources
  # Workers can scale horizontally - maintenance is handled by queue-supervisor
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 512Mi

# Values passed to biohub-platform-martin subchart
biohub-platform-martin:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    ts: ""
  app:
    database:
      useCrunchy: true
      # Use -primary, not pgbouncer: Martin's driver uses prepared statements, which are
      # incompatible with PgBouncer transaction pooling. A -replicas service also exists and is a
      # future option for keeping tile bursts off the primary.
      host: biohub-platform-db-dev-primary
      martinSecretName: biohub-platform-db-dev-pguser-martin
      dbNameSecretName: biohub-platform-db-dev-pguser-biohub-platform-db-dev
  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
