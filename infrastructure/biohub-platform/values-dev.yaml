# Development environment values for biohub-platform chart
environment:
  name: dev
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

# Disabled: DEV uses the separate Crunchy Postgres Helm release (infrastructure/crunchy-db).
database:
  enabled: false

database-setup:
  enabled: true

api:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""
  
  # App configuration
  app:
    nodeEnv: development
    apiHost: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca

    # Siteminder
    siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 300Mi

  # Route configuration
  route:
    host: dev-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    database:
      useCrunchy: true
      host: "biohub-platform-db-dev-pgbouncer"
      migrationHost: "biohub-platform-db-dev-primary"
      adminSecretName: "biohub-platform-db-dev-pguser-postgres"
      adminUserKey: "user"
      adminPasswordKey: "password"
      # Legacy deploy secret (has database-user-api=biohub_api and database-user-api-password)
      appSecretName: "biohub-platform-db-postgresql-dev-deploy"
      appUserKey: "database-user-api"
      appPasswordKey: "database-user-api-password"
      # Crunchy DB name comes from PGO app user secret (dbname = biohub-platform-db-dev)
      dbNameSecretName: "biohub-platform-db-dev-pguser-biohub-platform-db-dev"
      dbNameKey: "dbname"

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=2250 # 75% of memoryLimit (bytes)
    appHost: dev-biohub-platform.apps.silver.devops.gov.bc.ca

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: dev

    database:
      useCrunchy: true
      host: "biohub-platform-db-dev-pgbouncer"
      port: 5432
      # Legacy deploy secret (has database-user-api=biohub_api and database-user-api-password)
      appSecretName: "biohub-platform-db-postgresql-dev-deploy"
      appUserKey: "database-user-api"
      appPasswordKey: "database-user-api-password"
      # Crunchy DB name comes from PGO app user secret (dbname = biohub-platform-db-dev)
      dbNameSecretName: "biohub-platform-db-dev-pguser-biohub-platform-db-dev"
      dbNameKey: "dbname"
      adminSecretName: "biohub-platform-db-dev-pguser-postgres"
      adminUserKey: "user"
      adminPasswordKey: "password"

    # Object Store (S3)
    objectStore:
      keyPrefix: biohub

    # Logging
    logging:
      level: info
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 600m
      memory: 3Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohub-platform-api-dev-deploy"

  # Route configuration (OpenShift)
  route:
    host: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-queue subchart
biohub-platform-queue:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set
    ts: ""

  # Queue worker configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=512
    # objectStore.keyPrefix will be dynamically set: "biohub"

    database:
      useCrunchy: true
      host: "biohub-platform-db-dev-pgbouncer"
      port: 5432
      # Legacy deploy secret (has database-user-api=biohub_api and database-user-api-password)
      appSecretName: "biohub-platform-db-postgresql-dev-deploy"
      appUserKey: "database-user-api"
      appPasswordKey: "database-user-api-password"
      # Crunchy DB name comes from PGO app user secret (dbname = biohub-platform-db-dev)
      dbNameSecretName: "biohub-platform-db-dev-pguser-biohub-platform-db-dev"
      dbNameKey: "dbname"
      adminSecretName: "biohub-platform-db-dev-pguser-postgres"
      adminUserKey: "user"
      adminPasswordKey: "password"

    # Clamav
    clamav:
      enabled: true
      host: clamav
      port: 3310

    # Logging
    logging:
      level: info
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  # Workers can scale horizontally - maintenance is handled by queue-supervisor
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 512Mi