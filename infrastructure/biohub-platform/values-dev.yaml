# Development environment values for biohub-platform chart
environment:
  name: dev
  id: ""
  changeId: ""
  ts: ""

# Component enablement flags
app:
  enabled: true

database:
  enabled: true

database-setup:
  enabled: true

api:
  enabled: true

# Values passed to biohub-platform-app subchart
biohub-platform-app:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""
  
  # App configuration
  app:
    nodeEnv: development
    apiHost: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca

    # Siteminder
    siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 300Mi

  # Route configuration
  route:
    host: dev-biohub-platform.apps.silver.devops.gov.bc.ca

# Values passed to biohub-platform-db subchart
biohub-platform-db:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development
    postgresAdmin: ""
    postgresAdminPassword: ""
    postgresUser: ""
    postgresUserPassword: ""
    postgresUserApi: ""
    postgresUserApiPassword: ""
    postgresDb: ""

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 2Gi

  # Volume for persistent data
  persistence:
    existingClaim: "biohub-platform-db-postgresql-dev-deploy"

# Values passed to biohub-platform-db-setup subchart
biohub-platform-db-setup:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy  
    # changeId will be dynamically set: "1234"
    ts: ""

  # App configuration
  app:
    nodeEnv: development

# Values passed to biohub-platform-api subchart
biohub-platform-api:
  environment:
    licensePlate: "a0ec71"
    name: dev
    id: deploy
    # changeId will be dynamically set: "1234"
    ts: ""

  # API configuration
  app:
    nodeEnv: development
    nodeOptions: --max_old_space_size=2250 # 75% of memoryLimit (bytes)
    appHost: dev-biohub-platform.apps.silver.devops.gov.bc.ca

    # Keycloak
    keycloak:
      host: "https://dev.loginproxy.gov.bc.ca/auth"
      cssApi:
        environment: dev

    # Object Store (S3)
    objectStore:
      keyPrefix: biohub

    # Logging
    logging:
      level: info
      levelFile: debug
      fileMaxFiles: 10

  # Openshift Resources
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 600m
      memory: 3Gi

  # Volume for logs and persistent data
  persistence:
    existingClaim: "biohub-platform-api-dev-deploy"

  # Route configuration (OpenShift)
  route:
    host: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca