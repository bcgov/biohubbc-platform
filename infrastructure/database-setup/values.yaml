# Default values for database chart
environment:
  licensePlate: "a0ec71" # License plate of the project
  name: "" # Environment name (dev, test, prod)
  id: "" # Environment id (PR, deploy)
  changeId: "" # Change id (PR number)
  ts: "" # Timestamp of the deployment

image:
  registry: "image-registry.openshift-image-registry.svc:5000" # The base image registry URL
  image: a0ec71-tools/biohub-platform-db-setup # Always pull from tools namespace

# Database configuration
app:
  name: biohub-platform-db-setup
  nodeEnv: "" # NODE_ENV specification variable

  dbSchema: biohub # Database schema

  database:
    # Set useCrunchy: true for DEV/TEST/PROD environments that use the Crunchy Postgres cluster.
    # When false (default), connection details are derived from the legacy dbHost secret (PR environments).
    useCrunchy: false
    host: "" # e.g. "biohub-platform-db-dev-pgbouncer" (only used when useCrunchy: true; use -dev/-test/-prod for env)
    adminSecretName: "" # e.g. "biohub-platform-db-dev-pguser-postgres" (only used when useCrunchy: true)
    adminUserKey: "user" # Secret key for the admin DB username
    adminPasswordKey: "password" # Secret key for the admin DB password
    appSecretName: "" # e.g. "biohub-platform-db-dev-pguser-biohub-platform-db-dev" (only used when useCrunchy: true)
    appUserKey: "user" # Secret key for the app DB username
    appPasswordKey: "password" # Secret key for the app DB password
    dbNameSecretName: "" # e.g. "biohub-platform-db-dev-pguser-biohub-platform-db-dev" (only used when useCrunchy: true)
    dbNameKey: "dbname" # Secret key for the DB name

# Openshift Resources
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 1000m
    memory: 1792Mi # 1.75Gi