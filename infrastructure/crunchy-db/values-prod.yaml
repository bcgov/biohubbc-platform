# PROD environment overrides for Crunchy Postgres cluster.
# High-availability: 2 instances + 2 pgBouncer replicas, separate S3 backup path, higher retention.

fullnameOverride: biohub-platform-db-prod

instances:
  replicas: 2
  dataVolumeClaimSpec:
    storage: 20Gi
  requests:
    cpu: 100m
    memory: 512Mi

proxy:
  pgBouncer:
    replicas: 2

pgBackRest:
  repos:
    - name: repo1
      path: "/biohub/prod/hourly"
      fullSchedule: "0 12 * * *"
      retention: "1"
      retentionFullType: count
    - name: repo2
      path: "/biohub/prod/daily"
      fullSchedule: "0 0 * * *"
      retention: "7"
      retentionFullType: count
    - name: repo3
      path: "/biohub/prod/weekly"
      fullSchedule: "0 1 * * 0"
      retention: "4"
      retentionFullType: count
    - name: repo4
      path: "/biohub/prod/monthly"
      fullSchedule: "0 3 1 * *"
      retention: "12"
      retentionFullType: count

patroni:
  postgresql:
    parameters:
      shared_buffers: 64MB

# One-time restore: set dataSource.enabled: true, deploy, wait for recovery, then set enabled: false and redeploy.
# repo1 + daily path avoids --repo=2 bootstrap issues
# For a specific backup, set dataSource.options, e.g. ["--set=20260320-000008F"], or use time/LSN options per pgBackRest docs.
dataSource:
  enabled: false
  repo:
    name: repo1
    path: "/biohub/prod/daily"
  options:
    - "--set=20260320-000008F"

# To perform the one-time data migration from the old database, set:
#   migration.enabled: true
#   migration.oldDb.host: "biohub-platform-db-prod"
#   migration.oldDb.secretName: "biohub-platform-db-postgresql-prod"
# Then re-deploy with migration.enabled: false once complete.
migration:
  enabled: false
  oldDb:
    host: "biohub-platform-db-prod"
    secretName: "biohub-platform-db-postgresql-prod"