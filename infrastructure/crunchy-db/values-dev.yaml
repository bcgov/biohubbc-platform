# DEV environment overrides for Crunchy Postgres cluster.
# Single instance (no HA), separate S3 backup path.

crunchy-postgres:
  fullnameOverride: biohub-platform-db-dev

  instances:
    replicas: 1
    dataVolumeClaimSpec:
      storage: 5Gi
    requests:
      cpu: 50m
      memory: 256Mi

  proxy:
    pgBouncer:
      replicas: 1

  pgBackRest:
    retention: "7"
    s3:
      s3Path: "/biohub/dev"

  patroni:
    postgresql:
      parameters:
        shared_buffers: 16MB

# To perform the one-time data migration from the old database, set:
#   migration.enabled: true
#   migration.oldDb.host: <Service name of legacy Postgres in this namespace>
#   migration.oldDb.secretName: "biohub-platform-db-postgresql-dev-deploy"
# Host must be the Kubernetes Service name (e.g. biohub-platform-db-dev-deploy if different from secret).
# Then re-deploy with migration.enabled: false once complete.
migration:
  enabled: false
  oldDb:
    # Host = Service name for legacy Postgres (often same as secret; use 'oc get svc -n <namespace>' to confirm)
    host: "biohub-platform-db-dev-deploy"
    secretName: "biohub-platform-db-postgresql-dev-deploy"
