# DEV environment overrides for Crunchy Postgres cluster.
# Single instance (no HA), separate S3 backup path.

fullnameOverride: biohub-platform-db-dev

instances:
  replicas: 1
  dataVolumeClaimSpec:
    # Intentionally 20Gi while test/prod are 10Gi: this matches the volume dev
    # already has. PVCs cannot shrink in place, so a lower value here is never
    # applied - it just leaves the operator retry-looping on a rejected resize
    # (PersistentVolumeResizing=False/Invalid). Dev is a single instance with no
    # replica, so reclaiming the extra 10Gi means recreating the only database
    # volume, which needs quota headroom the namespace does not currently have.
    # Revisit once the stale PR-preview releases are cleaned up.
    storage: 20Gi
  requests:
    cpu: 50m
    memory: 256Mi

proxy:
  pgBouncer:
    replicas: 1

pgBackRest:
  repos:
    - name: repo1
      path: "/biohub/dev/hourly"
      fullSchedule: "0 12 * * *"
      retention: "1"
      retentionFullType: count
    - name: repo2
      path: "/biohub/dev/daily"
      fullSchedule: "0 0 * * *"
      retention: "7"
      retentionFullType: count
    - name: repo3
      path: "/biohub/dev/weekly"
      fullSchedule: "0 1 * * 0"
      retention: "4"
      retentionFullType: count
    - name: repo4
      path: "/biohub/dev/monthly"
      fullSchedule: "0 3 1 * *"
      retention: "12"
      retentionFullType: count

patroni:
  postgresql:
    parameters:
      shared_buffers: 16MB

# One-time restore: set dataSource.enabled: true, deploy, wait for recovery, then set enabled: false and redeploy.
# repo1 + daily path avoids --repo=2 bootstrap issues
# For a specific backup, set dataSource.options, e.g. ["--set=20260320-000008F"], or use time/LSN options per pgBackRest docs.
dataSource:
  enabled: false
  repo:
    name: repo1
    path: "/biohub/dev/daily"
  options:
    - "--set=20260320-000008F"

# To perform the one-time data migration from the old database, set:
#   migration.enabled: true
#   migration.oldDb.host: "biohub-platform-db-dev-deploy"
#   migration.oldDb.secretName: "biohub-platform-db-postgresql-dev-deploy"
# Then re-deploy with migration.enabled: false once complete.
migration:
  enabled: false
  oldDb:
    host: "biohub-platform-db-dev-deploy"
    secretName: "biohub-platform-db-postgresql-dev-deploy"