# Default values for the biohub-platform-martin chart.
# Environment specific values are supplied by the biohub-platform umbrella chart
# (infrastructure/biohub-platform/values-{pr,dev,test,prod}.yaml).

# Environment metadata, supplied by the umbrella chart and the deploy workflows
environment:
  licensePlate: "a0ec71"
  name: "" # Environment name (dev, test, prod)
  id: "" # Environment id (PR number, or "deploy" for static environments)
  changeId: "" # Change id (PR number, or build tag for static environments)
  ts: "" # Timestamp of the deployment

# Official Martin image. Public image, so there is no build step in the deploy workflows.
# To bump: check https://github.com/maplibre/martin/releases and keep the tag in step with
# MARTIN_VERSION in env_config/env.docker so local and deployed versions stay compatible.
image:
  repository: ghcr.io/maplibre/martin
  tag: "1.12.0"
  pullPolicy: IfNotPresent

replicas: 1

app:
  name: biohub-platform-martin

  martin:
    # Port Martin listens on, INSIDE the pod only (127.0.0.1). Not exposed by the Service.
    port: 3000
    # Martin worker threads
    workerProcesses: 2
    # Maximum Postgres connections held by Martin
    poolSize: 5

    # Explicitly published function sources. Automatic publication of tables and functions is
    # always disabled (see the ConfigMap template), so ONLY the sources listed here are served.
    functions:
      # Authorized search-result tiles. Resolves the opaque context id the gateway forwards and
      # applies the feature security predicate at serve time.
      # See database/src/procedures/03_tile_search.ts
      search:
        schema: biohub
        function: tile_search
        minzoom: 0
        # Matches MAP_MAX_ZOOM in app/src/constants/spatial.ts
        maxzoom: 15
        # [west, south, east, north] - British Columbia
        bounds: [-139.06, 48.30, -114.03, 60.00]

      # Synthetic source used to validate the tile stack end to end. Reads no tables.
      # Published for in-network smoke tests only; it is deliberately NOT in gateway.allowedSources,
      # so it is unreachable from outside the cluster.
      # See database/src/procedures/02_tile_fixture.ts
      fixture:
        schema: biohub
        function: tile_fixture
        minzoom: 0
        maxzoom: 15
        bounds: [-139.06, 48.30, -114.03, 60.00]

  database:
    port: 5432
    # useCrunchy: true = Crunchy Postgres (DEV/TEST/PROD). Set to false for PR environments
    # (legacy dbHost secret created by the biohub-platform-db chart).
    useCrunchy: true
    # e.g. "<cluster>-primary" (biohub-platform-db-dev-primary for DEV). Use primary, not
    # pgbouncer: Martin's driver uses prepared statements, which are incompatible with
    # PgBouncer transaction pooling. A "<cluster>-replicas" service also exists and is a
    # future option for keeping tile bursts off the primary.
    host: ""
    # e.g. "<cluster>-pguser-martin" (biohub-platform-db-dev-pguser-martin for DEV).
    # Created by the Crunchy Postgres Operator from the users block of the PostgresCluster CR.
    martinSecretName: ""
    # e.g. "<cluster>-pguser-<cluster>" (biohub-platform-db-dev-pguser-biohub-platform-db-dev)
    dbNameSecretName: ""
    # Secret keys default in the templates: user/password/dbname (override here if needed)
    martinUserKey: ""
    martinPasswordKey: ""
    dbNameKey: ""
    # PGO root CA for TLS verification (same secret name in all environments)
    caSecretName: "pgo-root-cacert"
    caSecretKey: "root.crt"
    # Postgres sslmode used in the Martin connection string. Left empty, it defaults to
    # "verify-full" when useCrunchy is true (matching the CA backed verification the api
    # performs) and "prefer" otherwise, since the legacy PR database serves no TLS.
    # Set explicitly to dial back to "verify-ca" if a host name mismatch appears.
    sslMode: ""

# The tile gateway. Runs as a sidecar in the Martin pod and is the only publicly reachable
# container: Martin binds loopback, so every tile request must pass token verification first.
gateway:
  image:
    registry: image-registry.openshift-image-registry.svc:5000
    image: a0ec71-tools/biohub-platform-tile-gateway
    pullPolicy: Always

  nodeEnv: production
  logLevel: info

  token:
    audience: biohub-tiles
    issuer: biohub-api
    # Secret holding the PUBLIC verification keys, one `<kid>.pem` per accepted key. Created
    # manually per namespace; see infrastructure/martin/README.md for the runbook.
    publicKeySecretName: tile-token-public

  # Sources the gateway will serve. Comma separated. Anything else is rejected regardless of what
  # Martin publishes, so an accidentally published source is still not publicly reachable. The
  # fixture source is deliberately excluded: it exists for in-network smoke tests only.
  allowedSources: search

  # Matches MAP_MIN_ZOOM/MAP_MAX_ZOOM in app/src/constants/spatial.ts
  minZoom: 0
  maxZoom: 15

  cache:
    # Also bounds how long a revoked feature can linger in a served tile.
    ttlSeconds: 300
    maxBytes: 52428800
    # Bump to invalidate every cached tile at deploy time. Required whenever biohub.tile_search
    # changes its output for identical inputs (including its cluster zoom threshold or grid size).
    sourceVersion: "2"

  rateLimit:
    # Must absorb a viewport pan, which requests many tiles at once.
    perTokenPerMinute: 600
    # Coarse backstop only: BC government networks NAT heavily.
    perIpPerMinute: 3000

  # Same origin in OpenShift, so this is effectively unused there.
  allowedOrigin: "*"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Public service. Targets the GATEWAY, never Martin.
service:
  type: ClusterIP
  name: 6300-tcp
  port: 6300
  targetPort: 6300

# Path based route on the app hostname. Leave host empty to derive it (PR environments).
route:
  host: ""
  path: /tiles

# Optional ingress hardening for the gateway port. Disabled by default: the namespace already
# applies an allow-same-namespace policy, and a policy that omitted the OpenShift router would take
# the public tile route offline.
networkPolicy:
  enabled: false
  allowedNamespaceSelectors: []
  allowedPodSelectors: []

# Martin container resources
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
