apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ include "environment.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    role: martin
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment: {{ include "app.fullname" . | quote }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        deployment: {{ include "app.fullname" . | quote }}
        role: martin
      annotations:
        # Roll the pods whenever the Martin configuration changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: martin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ['--config', '/etc/martin/config.yaml']
          env:
            # NOTE: order matters. DATABASE_URL is assembled from the variables above it using
            # Kubernetes dependent environment variable expansion.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinUserKey | default "user" }}{{ else }}database-user-martin{{ end }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinPasswordKey | default "password" }}{{ else }}database-user-martin-password{{ end }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameKey | default "dbname" }}{{ else }}database-name{{ end }}
            - name: DB_HOST
              value: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.host }}{{ else }}{{ include "dbHost" . }}{{ end }}
            - name: DB_PORT
              value: {{ .Values.app.database.port | quote }}
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode={{ .Values.app.database.sslMode | default (ternary "verify-full" "prefer" .Values.app.database.useCrunchy) }}"
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: martin-config
              mountPath: /etc/martin
              readOnly: true
            {{- if .Values.app.database.useCrunchy }}
            - name: pg-root-ca
              mountPath: /etc/pg-ssl
              readOnly: true
            {{- end }}
      volumes:
        - name: martin-config
          configMap:
            name: {{ include "app.fullname" . }}-config
        {{- if .Values.app.database.useCrunchy }}
        - name: pg-root-ca
          secret:
            secretName: {{ .Values.app.database.caSecretName }}
            items:
              - key: {{ .Values.app.database.caSecretKey }}
                path: {{ .Values.app.database.caSecretKey }}
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
