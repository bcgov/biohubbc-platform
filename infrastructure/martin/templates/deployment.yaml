apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ include "environment.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    role: martin
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment: {{ include "app.fullname" . | quote }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        deployment: {{ include "app.fullname" . | quote }}
        role: martin
      annotations:
        # Roll the pods whenever the Martin configuration changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- if .Values.app.martin.functions }}
      initContainers:
        # Martin resolves its function sources ONCE, at startup. The functions are created by the
        # database-setup Job's seeds, and Helm applies that Job and this Deployment in the same pass
        # — a chart cannot declare an ordering, so without a gate Martin starts first, finds no
        # sources, and publishes an empty catalog until something restarts it.
        #
        # Waiting here is the same shape the api already uses for the database
        # (infrastructure/api/templates/deployment.yaml), and it holds the pod in Init with a legible
        # reason rather than crashlooping. Because the wait is transitive, `helm upgrade --wait` now
        # effectively waits for database-setup too.
        #
        # Connects AS THE MARTIN ROLE deliberately: the check then covers the role's CONNECT and
        # schema USAGE grants as well as the functions, which is exactly the state Martin needs. If
        # the grants have not run, psql fails and the loop keeps waiting.
        - name: wait-for-tile-functions
          image: postgres:15-alpine
          command: ['sh', '-c']
          args:
            - |
              set -eu
              # The credentials come from a secret whose keys are populated from CI values, and an
              # unset CI value yields a present-but-empty key rather than a missing one, so the
              # secretKeyRef resolves and the emptiness only surfaces here. Checked before the loop
              # because an empty user is otherwise swallowed by psql's own argument parsing: the
              # shell drops the empty word, `-U` takes the next flag as its value, and the pod waits
              # forever reporting an authentication failure for a user named after a flag.
              : "${DB_USER:?is empty: set the martin database user (DATABASE_USER_MARTIN in CI, or the operator-managed secret)}"
              : "${DB_PASS:?is empty: set the martin database password (DATABASE_USER_MARTIN_PASSWORD in CI, or the operator-managed secret)}"
              : "${DB_NAME:?is empty: set the database name}"

              echo "Waiting for the Martin tile functions to be created..."
              {{- $predicates := list }}
              {{- range $id, $source := .Values.app.martin.functions }}
              {{- $predicates = append $predicates (printf "to_regprocedure('%s.%s(integer, integer, integer, json)') IS NOT NULL" $source.schema $source.function) }}
              {{- end }}
              until PGPASSWORD="$DB_PASS" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc \
                "SELECT {{ join " AND " $predicates }}" | grep -q '^t$'; do
                echo "Tile functions not created yet, waiting..."
                sleep 5
              done
              echo "Tile functions are ready!"
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinUserKey | default "user" }}{{ else }}database-user-martin{{ end }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.martinPasswordKey | default "password" }}{{ else }}database-user-martin-password{{ end }}
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameKey | default "dbname" }}{{ else }}database-name{{ end }}
            - name: DB_HOST
              value: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.host }}{{ else }}{{ include "dbHost" . }}{{ end }}
            - name: DB_PORT
              value: {{ .Values.app.database.port | quote }}
      {{- end }}
      containers:
        - name: martin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ['--config', '/etc/martin/config.yaml']
          env:
            {{- if .Values.app.database.useCrunchy }}
            # The operator's `uri` secret key is a complete connection URI whose userinfo the
            # operator percent-encodes when it builds the secret. Consuming it verbatim means
            # reserved characters in an operator-generated password can never produce an invalid
            # DATABASE_URL, which hand-assembling from `user`/`password` cannot guarantee. The
            # operator URI carries no query string, so the sslmode parameter appends cleanly.
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.app.database.martinSecretName }}
                  key: {{ .Values.app.database.martinUriKey | default "uri" }}
            - name: DATABASE_URL
              value: "$(DB_URI)?sslmode={{ .Values.app.database.sslMode | default "verify-full" }}"
            {{- else }}
            # NOTE: order matters. DATABASE_URL is assembled from the variables above it using
            # Kubernetes dependent environment variable expansion. No percent-encoding happens
            # here, so these project-controlled credentials (infrastructure/database chart) must
            # stay URL-safe; operator-managed environments consume the pre-encoded `uri` above.
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbHost" . }}
                  key: database-user-martin
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbHost" . }}
                  key: database-user-martin-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "dbHost" . }}
                  key: database-name
            - name: DB_HOST
              value: {{ include "dbHost" . }}
            - name: DB_PORT
              value: {{ .Values.app.database.port | quote }}
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode={{ .Values.app.database.sslMode | default "prefer" }}"
            {{- end }}
          # No containerPort: Martin listens on loopback and is not reachable from outside the pod.
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          # NOTE: exec probes, not httpGet. The kubelet dials the pod IP, which Martin no longer
          # listens on, so an httpGet probe would fail permanently. The official image is Alpine
          # based, so busybox wget is available.
          # Startup gates on every CONFIGURED source being PUBLISHED, not just on /health. Martin
          # starts with on_invalid: warn (see the ConfigMap) and only reads its sources once, so a
          # source that failed to resolve would otherwise leave the pod happily ready and serving no
          # tiles; failing the probe restarts the container until the catalog is complete.
          #
          # This is defence in depth, not the ordering mechanism: the wait-for-tile-functions
          # initContainer is what actually holds Martin back until the database-setup seeds have run.
          # What is left for the probe to catch is a source that exists but still fails to publish.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                {{- if .Values.app.martin.functions }}
                - >-
                  body="$(wget --quiet --output-document=- http://127.0.0.1:{{ .Values.app.martin.port }}/catalog)"
                  {{- range $id, $source := .Values.app.martin.functions }}
                  && printf '%s' "$body" | grep -q '"{{ $id }}"'
                  {{- end }}
                {{- else }}
                - wget --quiet --spider http://127.0.0.1:{{ .Values.app.martin.port }}/health
                {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            # 30 x 5s = 2.5 minutes. The initContainer already absorbed the wait for database-setup,
            # so by the time this runs the sources exist and publishing is fast.
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget --quiet --spider http://127.0.0.1:{{ .Values.app.martin.port }}/health
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: martin-config
              mountPath: /etc/martin
              readOnly: true
            {{- if .Values.app.database.useCrunchy }}
            - name: pg-root-ca
              mountPath: /etc/pg-ssl
              readOnly: true
            {{- end }}

        # Authenticating gateway. The ONLY container in this pod exposed by the Service and Route.
        - name: martin-gateway
          image: "{{ .Values.gateway.image.registry }}/{{ .Values.gateway.image.image }}:{{ include "app.imageTag" . }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          env:
            - name: NODE_ENV
              value: {{ .Values.gateway.nodeEnv }}
            - name: MARTIN_GATEWAY_PORT
              value: {{ .Values.service.port | quote }}
            # Loopback: the gateway and Martin share a network namespace.
            - name: MARTIN_URL
              value: "http://127.0.0.1:{{ .Values.app.martin.port }}"
            # Only PUBLIC keys are mounted here. The gateway can verify tokens but never mint one.
            - name: MARTIN_TOKEN_PUBLIC_KEY_DIR
              value: /etc/martin-keys
            # The kid the api signs with; startup asserts a matching public key file is present.
            # Read from global.martin.keyId, the same value the api signs with, so the two cannot
            # drift. The chart-local value is only a standalone-rendering fallback.
            - name: MARTIN_TOKEN_KID
              value: {{ ((.Values.global).martin).keyId | default .Values.gateway.token.expectedKeyId | quote }}
            - name: MARTIN_TOKEN_AUD
              value: {{ .Values.gateway.token.audience }}
            - name: MARTIN_TOKEN_ISS
              value: {{ .Values.gateway.token.issuer }}
            - name: MARTIN_ALLOWED_SOURCES
              value: {{ .Values.gateway.allowedSources | quote }}
            - name: MARTIN_MIN_ZOOM
              value: {{ .Values.gateway.minZoom | quote }}
            - name: MARTIN_MAX_ZOOM
              value: {{ .Values.gateway.maxZoom | quote }}
            # Bump to invalidate every tile Martin has cached at deploy time: the gateway appends
            # it to the upstream URL, and Martin's cache keys include the query string.
            - name: MARTIN_SOURCE_VERSION
              value: {{ .Values.gateway.sourceVersion | quote }}
            - name: RATE_LIMIT_JTI_PER_MIN
              value: {{ .Values.gateway.rateLimit.perTokenPerMinute | quote }}
            - name: RATE_LIMIT_IP_PER_MIN
              value: {{ .Values.gateway.rateLimit.perIpPerMinute | quote }}
            # Same origin in OpenShift (the Route serves /martin on the app host), so CORS is a no-op.
            - name: ALLOWED_ORIGIN
              value: {{ .Values.gateway.allowedOrigin | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          resources:
            requests:
              cpu: {{ .Values.gateway.resources.requests.cpu }}
              memory: {{ .Values.gateway.resources.requests.memory }}
            limits:
              cpu: {{ .Values.gateway.resources.limits.cpu }}
              memory: {{ .Values.gateway.resources.limits.memory }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            - name: martin-token-public
              mountPath: /etc/martin-keys
              readOnly: true
      volumes:
        - name: martin-config
          configMap:
            name: {{ include "app.fullname" . }}-config
        # Public verification keys only. One file per accepted key id, which is what allows a
        # rotation window: publish the new key alongside the old, cut the API over, then remove it.
        - name: martin-token-public
          secret:
            secretName: {{ .Values.gateway.token.publicKeySecretName }}
        {{- if .Values.app.database.useCrunchy }}
        - name: pg-root-ca
          secret:
            secretName: {{ .Values.app.database.caSecretName }}
            items:
              - key: {{ .Values.app.database.caSecretKey }}
                path: {{ .Values.app.database.caSecretKey }}
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
