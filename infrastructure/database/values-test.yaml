# Test environment values for Biohub
environment:
  name: test
  id: deploy

# Database configuration
app:
  nodeEnv: production # This is set to production as test is not a valid name in the Knexfile

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 1500m
    memory: 5Gi

# Volume for persistent data
persistence:
  existingClaim: "biohub-platform-db-postgresql-test"