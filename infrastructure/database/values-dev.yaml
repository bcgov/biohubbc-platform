# Development environment values for Biohub
environment:
  name: dev
  id: deploy

# Database configuration
app:
  nodeEnv: development

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 200m
    memory: 2Gi

# Volume for persistent data
persistence:
  existingClaim: "biohubbc-db-postgresql-dev-deploy"