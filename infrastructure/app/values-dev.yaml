# Development environment values for Biohub
environment:
  name: dev
  id: deploy

# App configuration
app:
  nodeEnv: development
  apiHost: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca

  # Siteminder
  siteminderLogoutURL: "https://logontest7.gov.bc.ca/clp-cgi/logoff.cgi"

  # Keycloak
  keycloak:
    host: "https://dev.loginproxy.gov.bc.ca/auth"

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 300m
    memory: 300Mi

# Route configuration
route:
  host: dev-biohub-platform.apps.silver.devops.gov.bc.ca