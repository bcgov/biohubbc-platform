# Test environment values for Biohub
environment:
  name: test
  id: deploy
  
# API configuration
app:
  nodeEnv: production
  nodeOptions: --max_old_space_size=3000 # 75% of memoryLimit (bytes)
  appHost: test-biohubbc.apps.silver.devops.gov.bc.ca

  # Keycloak
  keycloak:
    host: "https://test.loginproxy.gov.bc.ca/auth"
    cssApi:
      environment: test

  # Object Store (S3)
  objectStore:
    keyPrefix: biohub
    
  # Logging
  logging:
    level: warn
    levelFile: debug
    fileMaxFiles: 10

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 1250m
    memory: 4Gi

# Volume for logs and persistent data
persistence:
  existingClaim: "biohubbc-api-test"

# Route configuration (OpenShift)
route:
  host: api-test-biohubbc.apps.silver.devops.gov.bc.ca