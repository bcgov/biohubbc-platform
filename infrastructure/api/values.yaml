# Default values for api chart
environment:
  licensePlate: "a0ec71" # License plate of the project
  name: "" # Environment name (dev, test, prod)
  id: "" # Environment id (PR, deploy)
  changeId: "" # Change id (PR number)
  ts: "" # Timestamp of the deployment

image:
  registry: "image-registry.openshift-image-registry.svc:5000" # The base image registry URL
  image: a0ec71-tools/biohub-platform-api # Always pull from tools namespace

# API configuration
app:
  name: biohub-platform-api
  nodeEnv: "" # NODE_ENV specification variable
  nodeOptions: "" # NODE_OPTIONS specification variable
  appHost: "" # APP host for application frontend
  timezone: America/Vancouver # Application timezone

  # Clamav
  clamav:
    enabled: true
    host: clamav
    port: 3310

  # Database
  database:
    secretName: biohub-platform-db # Unused: legacy path uses hardcoded dbHost helper (biohub-platform-db + app.suffix) for secret name
    serviceName: "" # Unused: reserved for future use
    port: 5432 # Database port
    # useCrunchy: true = Crunchy Postgres (DEV/TEST/PROD). Set to false for PR environments (legacy dbHost secret).
    useCrunchy: true
    host: "" # e.g. "<release>-primary" (biohub-platform-db-dev-primary for DEV); use primary not pgbouncer (biohub_api not in PgBouncer config)
    appSecretName: "" # e.g. "<release>-pguser-biohub-api" (biohub-platform-db-dev-pguser-biohub-api for DEV)
    dbNameSecretName: "" # e.g. "<release>-pguser-<cluster-name>" (biohub-platform-db-dev-pguser-biohub-platform-db-dev for DEV)
    adminSecretName: "" # e.g. "<release>-pguser-postgres" (biohub-platform-db-dev-pguser-postgres for DEV)
    # Secret keys default in templates: user/password/dbname (override in parent values if needed)
    # PGO root CA for TLS verification (same secret name in all envs)
    caSecretName: "pgo-root-cacert"
    caSecretKey: "root.crt"

  # Martin tile token minting (SIMSBIOHUB-1102)
  martin:
    # Disabled by default: enabling mounts the martin-token-private secret, which is created
    # manually per namespace (see infrastructure/martin/README.md), and a missing secret would
    # leave the whole api pod stuck in ContainerCreating. Each environment opts in explicitly in
    # the umbrella chart's values-{dev,test,prod,pr}.yaml once its secret exists.
    enabled: false
    # Secret holding the RS256 PRIVATE signing key. Created manually per namespace; see
    # infrastructure/martin/README.md for the generation and rotation runbook.
    privateKeySecretName: martin-token-private
    privateKeySecretKey: private.pem
    # Key id embedded in the token header, so the gateway can pick the right public key. It must
    # match a `<kid>.pem` in the martin-token-public secret, and the kid the gateway verifies with.
    #
    # FALLBACK ONLY. In the umbrella chart this is overridden by `global.martin.keyId`, which the
    # gateway reads too - one value, so the two cannot drift. Change it there, not here; this exists
    # so the api chart still renders standalone.
    keyId: "2026-07"
    audience: biohub-tiles
    issuer: biohub-api
    tokenTtlSeconds: 900
    # Relative: the Martin Gateway is served on /martin of this environment's app hostname, so tiles
    # are same origin and no per-environment host has to be threaded through.
    externalUrl: /martin
    # Per IP budget for the unauthenticated mint endpoint. Coarse on purpose: BC government
    # networks NAT heavily.
    mintRateLimit: 60
    mintRateLimitWindowMinutes: 5
    # Context lifetime, seconds. Also the staleness bound on a materialized result set.
    contextTtlSeconds: 1800
    # Maximum features one Martin session may map. Over-cap searches are refused, not truncated.
    maxFeatures: 50000
    # Maximum live (unexpired) MATERIALIZED contexts. Bounds the database growth an anonymous caller
    # can force by varying the search per mint. At the cap a new context evicts the one closest to
    # expiry rather than being refused, so no caller can lock the others out of new searches.
    # Unfiltered browse-all sessions are not materialized and are never capped.
    contextMaxLive: 200

  keycloak:
    host: "" # Keycloak login url
    realm: standard # Realm identifier or name
    clientId: bio-hub-browser-4230 # Client Id for application
    keycloakSecret: keycloak # The name of the keycloak secret
    serviceClient:
      name: biohub-svc-4466 # keycloak host admin username
      passwordKey: biohub_svc_client_password # The key of the admin password in the keycloak secret
    cssApi:
      tokenUrl: "https://loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token" # The url to fetch a css api access token, which is needed to call the css rest api
      clientId: service-account-team-1159-4197 # The css api client id
      host: "https://api.loginproxy.gov.bc.ca/api/v1" # The url of the css rest api
      secretKey: css_api_client_secret # The css api client secret
      environment: "" # The css api environment to query (dev, test, prod)

  # Object Store (S3)
  objectStore:
    keyPrefix: "" # S3 key optional prefix
    secretName: biohubbc-object-store # Secrets used to read and write to the S3 storage
  
  # Quarantine Object Store (S3)
  quarantineObjectStore:
    secretName: quarantine-object-store # Secrets used to read and write to the S3 storage

  # Logging
  logging:
    level: "" # Log level for logs written to the console (console transport)
    levelFile: "" # Log level for logs written to log files (file transport)
    fileDir: data/logs # Directory where log files are stored
    fileName: biohub-platform-api.log # Name of the log file
    fileDatePattern: YYYY-MM-DD # Date pattern for log the files
    fileMaxSize: 45m # Maximum size an individual log file can reach before a new file is created
    fileMaxFiles: "" # Either the maximum number of log files to keep (10) or the maximum number of days to keep log files (10d)

  # Submission archive multipart upload sizing
  uploadMultipart:
    partSizeCapBytes: "104857600" # Prefer max 100 MiB part size (configurable)
    targetPartCount: "10" # Prefer ~10 or fewer parts when possible
    scaleStartBytes: "" # Optional override for UPLOAD_PART_SIZE_SCALE_START_BYTES
    scaleStepBytes: "" # Optional override for UPLOAD_PART_SIZE_SCALE_STEP_BYTES
    scaleStepIncrementBytes: "" # Optional override for UPLOAD_PART_SIZE_SCALE_STEP_INCREMENT_BYTES
    presignedUrlBatchSize: "" # Optional override for UPLOAD_PRESIGNED_URL_BATCH_SIZE
    presignedUrlExpirySeconds: "" # Optional override for UPLOAD_PRESIGNED_URL_EXPIRY_SECONDS

  # ITIS SOLR
  itisSolr: "https://services.itis.gov"
  itisTsnLookupBatchSize: "100"
  itisTsnLookupDelayMs: "1000"

  # GCNotify
  gcnotify:
    apiSecret: gcnotify-api-key # Secret for gcnotify api key
    adminEmail: biohub@gov.bc.ca # admin email for gcnotify api
    onboardingRequestEmailTemplate: 7779a104-b863-40ac-902f-1aa607d2071a # gcnotify email template id
    onboardingRequestSmsTemplate: af2f1e40-bd72-4612-9c5a-567ee5b26ca5 # gcnotify sms template id
    requestAccessSecureDocuments: 4bb42a76-f79b-424f-ad0f-ad3671389ec2 # gcnotify email request access secure documents template id
    emailUrl: "https://api.notification.canada.ca/v2/notifications/email"
    smsUrl: "https://api.notification.canada.ca/v2/notifications/sms" 

# Openshift Resources
replicas: ""
resources:
  requests:
    cpu: ""
    memory: ""
  limits:
    cpu: ""
    memory: ""

# Volume for logs and persistent data
persistence:
  enabled: true
  size: "" # Volume space available for data, e.g. 512Mi, 2Gi.
  storageClass: ""
  accessMode: ReadWriteMany
  mountPath: /opt/app-root/app/data

# Service configuration
service:
  type: ClusterIP
  name: 6100-tcp
  port: 6100
  targetPort: 6100

# Route configuration (OpenShift)
route:
  host: ""
