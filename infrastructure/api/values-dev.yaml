# Development environment values for Biohub
environment:
  name: dev
  id: deploy
  
# API configuration
app:
  nodeEnv: development
  nodeOptions: --max_old_space_size=2250 # 75% of memoryLimit (bytes)
  appHost: dev-biohub-platform.apps.silver.devops.gov.bc.ca
  : ""

  # Keycloak
  keycloak:
    host: "https://dev.loginproxy.gov.bc.ca/auth"
    cssApi:
      environment: dev

  # Object Store (S3)
  objectStore:
    keyPrefix: biohub
    
  # Logging
  logging:
    level: info
    levelFile: debug
    fileMaxFiles: 10

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 600m
    memory: 3Gi

# Volume for logs and persistent data
persistence:
  existingClaim: "biohub-platform-api-dev-deploy"

# Route configuration (OpenShift)
route:
  host: api-dev-biohub-platform.apps.silver.devops.gov.bc.ca