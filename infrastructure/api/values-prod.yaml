# Production environment values for Biohub
environment:
  name: prod
  id: deploy
  
# API configuration
app:
  nodeEnv: production
  nodeOptions: --max_old_space_size=4500  # 75% of 6Gi memory limit
  appHost: sims.nrs.gov.bc.ca  # Vanity URL for prod

  # Keycloak
  keycloak:
    host: "https://loginproxy.gov.bc.ca/auth"
    cssApi:
      environment: prod

  # Object Store (S3)
  objectStore:
    keyPrefix: biohub
  
  # Logging
  logging:
    level: silent
    levelFile: debug
    fileMaxFiles: 10

# Openshift Resources
replicas: 1
resources:
  requests:
    cpu: 50m
    memory: 100Mi
  limits:
    cpu: 1500m
    memory: 6Gi

# Volume for logs and persistent data
persistence:
  existingClaim: "biohubbc-api-prod"

# Route configuration (OpenShift)
route:
  host: api-biohub-platform.apps.silver.devops.gov.bc.ca