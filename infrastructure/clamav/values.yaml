fullnameOverride: clamav

image:
  repository: clamav/clamav-debian
  tag: "1.4"
  pullPolicy: IfNotPresent

service:
  name: clamav
  port: 3310

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

persistence:
  enabled: true
  size: 2Gi
  storageClassName: netapp-file-standard
  accessMode: ReadWriteOnce

networkPolicy:
  enabled: false
  allowedPodSelectors:
    - app.kubernetes.io/name: biohub-platform-api
    - app.kubernetes.io/name: biohub-platform-queue

freshclam:
  databaseMirror: https://clamav-mirror.apps.silver.devops.gov.bc.ca

clamd:
  logFile: /dev/stdout
  tcpSocket: 3310
  logVerbose: true
  logTime: true
  logClean: true
  logSyslog: false
  foreground: true
  streamMaxLength: 4000M
  maxFileSize: 4000M
  maxScanSize: 4000M
  maxThreads: 20
  maxConnectionQueueLength: 30
  readTimeout: 300
  selfCheck: 600
  allowSupplementaryGroups: true
  extraDirectives: []
