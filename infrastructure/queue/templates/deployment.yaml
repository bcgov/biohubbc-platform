apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ include "environment.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    role: queue-worker
  annotations:
    {{- include "app.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      deployment: {{ include "app.fullname" . | quote }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        deployment: {{ include "app.fullname" . | quote }}
        role: queue-worker
    spec:
      initContainers:
        - name: wait-for-database
          image: postgres:15-alpine
          command: ['sh', '-c']
          args:
            - |
              until pg_isready -h $DB_HOST -p {{ .Values.app.database.port }} -U $DB_USER_API; do
                echo "Waiting for database to be ready..."
                sleep 5
              done
              echo "Database is ready!"
          env:
            - name: DB_HOST
              value: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.host }}{{ else }}{{ include "dbHost" . }}{{ end }}
            - name: DB_USER_API
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appUserKey | default "user" }}{{ else }}database-user-api{{ end }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appPasswordKey | default "password" }}{{ else }}database-user-api-password{{ end }}
        - name: wait-for-database-setup
          image: postgres:15-alpine
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for database-setup job to complete..."
              until PGPASSWORD=$DB_CHECK_PASS psql -h $DB_HOST -U $DB_CHECK_USER -d $DB_DATABASE -c "SELECT 1;" | grep -q "1"; do
                echo "Database-setup not complete, waiting..."
                sleep 5
              done
              echo "Database-setup completed successfully!"
          env:
            - name: DB_HOST
              value: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.host }}{{ else }}{{ include "dbHost" . }}{{ end }}
            - name: DB_CHECK_USER
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appUserKey | default "user" }}{{ else }}database-admin{{ end }}
            - name: DB_CHECK_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appPasswordKey | default "password" }}{{ else }}database-admin-password{{ end }}
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameKey | default "dbname" }}{{ else }}database-name{{ end }}
      containers:
        - name: queue-worker
          command: ['node', 'src/queue.js']
          env:
            - name: VERSION
              value: {{ .Values.environment.name }}-{{ .Chart.AppVersion }}-{{ .Values.environment.changeId }}
            - name: CHANGE_VERSION
              value: {{ .Values.environment.changeId | quote }}
            - name: NODE_ENV
              value: {{ .Values.app.nodeEnv }}
            - name: NODE_OPTIONS
              value: {{ .Values.app.nodeOptions }}
            # Clamav
            - name: ENABLE_FILE_VIRUS_SCAN
              value: {{ .Values.app.clamav.enabled | quote }}
            - name: CLAMAV_HOST
              value: {{ .Values.app.clamav.host }}
            - name: CLAMAV_PORT
              value: {{ .Values.app.clamav.port | quote }}
            # Database
            - name: TZ
              value: {{ .Values.app.timezone }}
            - name: DB_HOST
              value: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.host }}{{ else }}{{ include "dbHost" . }}{{ end }}
            - name: DB_USER_API
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appUserKey | default "user" }}{{ else }}database-user-api{{ end }}
            - name: DB_USER_API_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.appPasswordKey | default "password" }}{{ else }}database-user-api-password{{ end }}
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameSecretName }}{{ else }}{{ include "dbHost" . }}{{ end }}
                  key: {{ if .Values.app.database.useCrunchy }}{{ .Values.app.database.dbNameKey | default "dbname" }}{{ else }}database-name{{ end }}
            - name: DB_PORT
              value: {{ .Values.app.database.port | quote }}
            {{- if .Values.app.database.useCrunchy }}
            - name: PG_SSL_CA_PATH
              value: "/etc/pg-ssl/{{ .Values.app.database.caSecretKey }}"
            {{- end }}
            # Object Store (S3) - needed for job processing
            - name: OBJECT_STORE_URL
              valueFrom:
                secretKeyRef:
                  key: object_store_url
                  name: {{ .Values.app.objectStore.secretName }}
            - name: OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: object_store_access_key_id
                  name: {{ .Values.app.objectStore.secretName }}
            - name: OBJECT_STORE_SECRET_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: object_store_secret_key_id
                  name: {{ .Values.app.objectStore.secretName }}
            - name: OBJECT_STORE_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  key: object_store_bucket_name
                  name: {{ .Values.app.objectStore.secretName }}
            - name: S3_KEY_PREFIX
              value: {{ if .Values.app.objectStore.keyPrefix }}{{ .Values.app.objectStore.keyPrefix }}{{ else }}local/{{ .Values.environment.changeId }}/biohub{{ end }}
            # Quarantine Object Store (S3)
            - name: QUARANTINE_OBJECT_STORE_URL
              valueFrom:
                secretKeyRef:
                  key: endpoint
                  name: {{ .Values.app.quarantineObjectStore.secretName }}
            - name: QUARANTINE_OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: access_key
                  name: {{ .Values.app.quarantineObjectStore.secretName }}
            - name: QUARANTINE_OBJECT_STORE_SECRET_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: secret_key
                  name: {{ .Values.app.quarantineObjectStore.secretName }}
            - name: QUARANTINE_OBJECT_STORE_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  key: bucket
                  name: {{ .Values.app.quarantineObjectStore.secretName }}
            # Logging
            - name: LOG_LEVEL
              value: {{ .Values.app.logging.level }}
            - name: LOG_LEVEL_FILE
              value: {{ .Values.app.logging.levelFile }}
            - name: LOG_FILE_DIR
              value: {{ .Values.app.logging.fileDir }}
            - name: LOG_FILE_NAME
              value: {{ .Values.app.logging.fileName }}
            - name: LOG_FILE_DATE_PATTERN
              value: {{ .Values.app.logging.fileDatePattern }}
            - name: LOG_FILE_MAX_SIZE
              value: {{ .Values.app.logging.fileMaxSize | quote }}
            - name: LOG_FILE_MAX_FILES
              value: {{ .Values.app.logging.fileMaxFiles | quote }}
            # Ingestion pipeline
            {{- if .Values.app.ingestion.featureBatchSize }}
            - name: INGESTION_FEATURE_BATCH_SIZE
              value: {{ .Values.app.ingestion.featureBatchSize | quote }}
            {{- end }}
            {{- if .Values.app.ingestion.contributorCodeBatchSize }}
            - name: INGESTION_CONTRIBUTOR_CODE_BATCH_SIZE
              value: {{ .Values.app.ingestion.contributorCodeBatchSize | quote }}
            {{- end }}
            {{- if .Values.app.ingestion.mediaBatchBytes }}
            - name: INGESTION_MEDIA_BATCH_BYTES
              value: {{ .Values.app.ingestion.mediaBatchBytes | quote }}
            {{- end }}
            {{- if .Values.app.ingestion.mediaBatchFiles }}
            - name: INGESTION_MEDIA_BATCH_FILES
              value: {{ .Values.app.ingestion.mediaBatchFiles | quote }}
            {{- end }}
            # Security scope
            {{- if .Values.app.security.scopeAnchorBatchSize }}
            - name: SECURITY_SCOPE_ANCHOR_BATCH_SIZE
              value: {{ .Values.app.security.scopeAnchorBatchSize | quote }}
            {{- end }}
            # Upload pipeline (archive ingestion)
            {{- if .Values.app.uploadIngestion.featureBatchMaxBytes }}
            - name: UPLOAD_FEATURE_BATCH_MAX_BYTES
              value: {{ .Values.app.uploadIngestion.featureBatchMaxBytes | quote }}
            {{- end }}
            {{- if .Values.app.uploadIngestion.mediaConcurrency }}
            - name: UPLOAD_ARCHIVE_MEDIA_CONCURRENCY
              value: {{ .Values.app.uploadIngestion.mediaConcurrency | quote }}
            {{- end }}
            {{- if .Values.app.uploadIngestion.jobBatchSize }}
            - name: UPLOAD_JOB_BATCH_SIZE
              value: {{ .Values.app.uploadIngestion.jobBatchSize | quote }}
            {{- end }}
            {{- if .Values.app.uploadIngestion.jsonFileMaxBytes }}
            - name: UPLOAD_ARCHIVE_JSON_FILE_MAX_BYTES
              value: {{ .Values.app.uploadIngestion.jsonFileMaxBytes | quote }}
            {{- end }}
            # Download pipeline
            {{- if .Values.app.download.featureBatchSize }}
            - name: DOWNLOAD_FEATURE_BATCH_SIZE
              value: {{ .Values.app.download.featureBatchSize | quote }}
            {{- end }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.image }}:{{ include "app.imageTag" . }}"
          imagePullPolicy: Always
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          # No HTTP probes - worker has no HTTP endpoint
          # Use exec probe to verify process is running
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "node src/queue.js" > /dev/null
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pgrep -f "node src/queue.js" > /dev/null
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
            {{- if .Values.app.database.useCrunchy }}
            - name: pg-root-ca
              mountPath: /etc/pg-ssl
              readOnly: true
            {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      # Allow time for pg-boss to gracefully complete jobs
      terminationGracePeriodSeconds: 120
      volumes:
        {{- if .Values.app.database.useCrunchy }}
        - name: pg-root-ca
          secret:
            secretName: {{ .Values.app.database.caSecretName }}
            items:
              - key: {{ .Values.app.database.caSecretKey }}
                path: {{ .Values.app.database.caSecretKey }}
        {{- end }}
